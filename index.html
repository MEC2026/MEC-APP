<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2E4F">
<title>MEC-APP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" as="image" href="logo-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1D2E4F; --navy2:#2A4170; --gold:#E8AA2E; --gold-soft:#FBF1DC;
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#1B2333; --muted:#6B7280; --line:#E3E6EB;
  --ok:#1E8E5A; --ok-bg:#E6F4EC; --warn:#B7791F; --warn-bg:#FDF3DC; --bad:#C0392B; --bad-bg:#FBE9E7;
  --r:14px; --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;overflow-x:hidden}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:12px;opacity:.75}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;flex:none}
.ibtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative}
.ibtn:active{background:rgba(255,255,255,.12)}
.dot{position:absolute;top:4px;left:4px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.demo{background:var(--gold-soft);color:#7a5a00;font-size:12.5px;text-align:center;padding:6px 16px;border-bottom:1px solid #F3DFA6}

/* layout */
main{padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
h2.sec{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .more{margin-inline-start:auto;font-size:13px;font-weight:600;color:var(--navy2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.stack>*+*{margin-top:10px}

/* latest cards strip */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.kc{flex:0 0 78%;max-width:280px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start}
.kc .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kc .val{font-size:20px;font-weight:700;margin:4px 0 2px;direction:ltr;text-align:right}
.kc .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money.masked .mv{filter:blur(7px);user-select:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:#EAF0FA;color:var(--navy2)}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:start}
.li+.li{margin-top:8px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:12.5px}
.ico{width:38px;height:38px;border-radius:10px;background:#EEF2F8;color:var(--navy);display:grid;place-items:center;flex:none}

/* project card */
.pc{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pc+.pc{margin-top:10px}
.pc .head{display:flex;align-items:flex-start;gap:8px}
.sunhint{display:flex;align-items:center;gap:8px;background:#FFF6DC;color:#6B4E00;font-size:13px;padding:6px 12px;border-bottom:1px solid #F0DFA8}.sunhint button{background:none;border:0;font-weight:700;color:inherit;font-size:13px;padding:2px 6px}
.pact{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#F7F8FA;display:inline-flex;align-items:center;justify-content:center;color:var(--navy2)}
.pact svg{width:18px;height:18px}
.pvData summary{list-style:none;font-weight:600}.pvData summary::-webkit-details-marker{display:none}.pvData summary::after{content:'▾';margin-inline-start:auto;color:var(--muted)}.pvData[open] summary::after{content:'▴'}
.pc .head{align-items:center}
.pc .head b{flex:1;font-size:15.5px;font-weight:700;line-height:1.4}
.pc .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:#EDF0F4;border-radius:6px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--navy2);border-radius:6px}
.pc .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* grid of sections */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;position:relative;min-height:92px}
.tile .soon{position:absolute;top:6px;left:6px;font-size:10px;font-weight:600;color:var(--muted);background:#F1F3F6;border-radius:6px;padding:0 5px}
.tile.live{border-color:var(--navy2)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* bottom nav */
nav.bn{position:fixed;bottom:0;inset-inline:0;z-index:30;background:#fff;border-top:1px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav.bn button.on{color:var(--navy);font-weight:700}
nav.bn .fab{width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--navy);margin:-22px auto 0;box-shadow:0 4px 12px rgba(29,46,79,.25);display:grid;place-items:center}
nav.bn .fab svg{width:26px;height:26px;stroke-width:2}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,22,38,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;background:#fff;border-radius:20px 20px 0 0;max-height:85vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#D5D9E0;margin:6px auto 12px}
.sheet h3{margin:0 0 12px;font-size:16px}
.mi{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #F0F2F5;width:100%;text-align:start;font-weight:600}
.mi:last-child{border-bottom:0}
.mi .soon{margin-inline-start:auto;font-size:11px;color:var(--muted);background:#F1F3F6;border-radius:6px;padding:1px 7px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa button{background:#F5F7FA;border:1px solid var(--line);border-radius:var(--r);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:15px}
.in:focus{outline:2px solid #C9D6EE;border-color:var(--navy2)}
textarea.in{min-height:88px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:12px;font-weight:700}
.btn.pri{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{border:1px solid var(--line);background:#fff}
.saved{font-size:12px;color:var(--ok);min-height:16px;margin-top:4px}
.sheetX{position:sticky;top:0;float:left;width:36px;height:36px;border-radius:50%;background:#F1F3F6;display:grid;place-items:center;z-index:2;margin-top:-6px}

/* screens: login & install */
.full{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(24px + env(safe-area-inset-bottom));background:#fff;color:var(--ink)}
.full .box{max-width:400px;width:100%;margin:0 auto}
.logo{width:150px;height:150px;margin:0 auto 6px;display:block}
.brand{text-align:center;margin-bottom:18px}
.brand b{display:block;font-size:22px}
.brand small{opacity:.8}
.users{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.users button{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.users button.on{border-color:var(--navy);background:#EEF2F8}
.users button b{display:block;font-size:14px}
.users button small{color:var(--muted);font-size:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.steps{margin:10px 0 0;padding-inline-start:20px;color:var(--muted);font-size:13.5px}

.toast{position:fixed;top:calc(66px + env(safe-area-inset-top));inset-inline:16px;z-index:60;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;text-align:center;opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty svg{width:40px;height:40px;stroke-width:1.2;color:#AAB2C0}
.news{background:linear-gradient(0deg,#fff,#fff);border:1px solid #F3DFA6;background:var(--gold-soft)}
.bdg{position:absolute;top:3px;left:3px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bar{height:6px;border-radius:4px;background:#EEF0F4;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:4px}
.tl{margin-top:10px;font-size:12.5px;color:var(--muted)}
.nt{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid #F0F2F5}.nt:last-child{border-bottom:0}.nt.un b{color:var(--ink)}.nt .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;margin-top:7px}.nt.rd .dot{background:transparent}
.grp{font-size:12.5px;font-weight:700;color:var(--navy2);margin:14px 2px 4px}
.pinb{background:none;border:0;padding:2px;display:inline-grid;place-items:center}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:#EEF0F4;display:inline-grid;place-items:center;font-weight:700;color:var(--navy2);font-size:14px}
.qk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.qk button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14.5px;position:relative;min-height:96px}
.qk button svg{width:30px;height:30px}.qk .st{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px}.qk .cnt{position:absolute;top:6px;left:8px;background:var(--gold);color:var(--navy);border-radius:9px;font-size:11px;padding:0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 6px;white-space:nowrap;font-size:13px;font-weight:600}.chip.on{border-color:var(--navy);background:#EAF0FA}
.big{position:fixed;inset:0;background:rgba(15,25,45,.6);z-index:80;display:grid;place-items:center;padding:20px}.big>div{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%;text-align:center}.big b{display:block;font-size:22px;line-height:1.6;margin:8px 0 16px}
.upd{position:fixed;bottom:84px;left:12px;right:12px;z-index:70;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600}
body.sun{font-size:17.5px}body.sun .muted,body.sun small{color:#2b2f36!important}body.sun .card,body.sun .li,body.sun .tile,body.sun .pc{border-color:#8B93A1;border-width:1.5px}body.sun .in{border-color:#6B7280;font-size:17px}body.sun .tab{border-color:#6B7280}
.mic{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;flex:none}.mic.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

/* ===== 0.10.7: شكل فاتح — الكحلي في الهيدر بس، وكل قسم ليه لون ===== */
:root{--pri:#2F6DB5;--pri-soft:#E8F0FB;--pri-line:#C6D7F0;--ink-gold:#4A3500;--bg:#F3F6FA;
  --c-att:#2E9E6B;--c-att-s:#E5F5EC;--c-mat:#E08A2E;--c-mat-s:#FDF0E1;--c-eq:#C99A00;--c-eq-s:#FBF3D9;--c-money:#3B7DD8;--c-money-s:#E8F0FB;--c-prod:#7B61C9;--c-prod-s:#EFEBFA;--c-take:#1C9AA8;--c-take-s:#E2F4F6}
.top{background-color:var(--navy);background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:18px 18px;box-shadow:0 2px 10px rgba(29,46,79,.18)}
.top::after{content:'';position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),#F6D27A 40%,transparent)}
.avatar,.dot,.bdg,.qk .cnt{color:var(--ink-gold)}
.card,.li,.pc,.tile,.kc,.qk button{box-shadow:0 1px 2px rgba(20,40,80,.04),0 4px 14px rgba(20,40,80,.035);border-color:#E6EAF0}
h2.sec{color:#24324D}h2.sec .more{color:var(--pri)}
.ico{background:var(--pri-soft);color:var(--pri)}
.tab.on{background:#FFF3D6;color:#6B4E00;border-color:#EBC877}
.btn.pri{background:var(--pri-soft);color:#1F4E8C;border:1px solid var(--pri-line)}
.btn.gold{background:linear-gradient(180deg,#F0B840,var(--gold));color:var(--ink-gold);box-shadow:0 2px 8px rgba(232,170,46,.28)}
.btn.ghost{border-color:#DCE3EC}
.chip.on{border-color:#8FB0E0;background:var(--pri-soft);color:#1F4E8C}
.users button.on{border-color:#8FB0E0;background:var(--pri-soft)}
nav.bn{box-shadow:0 -2px 12px rgba(20,40,80,.06)}
nav.bn button.on{color:var(--pri)}
nav.bn .fab{color:var(--ink-gold);box-shadow:0 4px 14px rgba(232,170,46,.45)}
.upd{background:#FFF4D6;color:#5C4300;border:1px solid #EBC877;box-shadow:0 6px 20px rgba(20,40,80,.15)}
.upd .btn,.upd button{color:#5C4300}
.pact{color:var(--pri);background:var(--pri-soft);border-color:var(--pri-line)}
.grp,.av{color:var(--pri)}
.in:focus{outline:2px solid var(--pri-line);border-color:var(--pri)}
.bar i{background:var(--pri)}
.tile.live{border-color:#DCE3EC}
.toast{background:#fff;color:var(--ink);border:1px solid #E3E8F0;border-inline-start:5px solid var(--gold);box-shadow:0 8px 24px rgba(20,40,80,.16);font-weight:600}
.p-info{background:var(--pri-soft);color:#1F4E8C}
/* ألوان الأقسام */
.tile[data-sec="att"] .ico{background:var(--c-att-s);color:var(--c-att)}
.tile[data-sec="mat"] .ico{background:var(--c-mat-s);color:var(--c-mat)}
.tile[data-sec="eq"] .ico{background:var(--c-eq-s);color:var(--c-eq)}
.tile[data-sec="exp"] .ico,.tile[data-sec="acc"] .ico{background:var(--c-money-s);color:var(--c-money)}
.tile[data-sec="takeoff"] .ico,.tile[data-sec="boq"] .ico{background:var(--c-take-s);color:var(--c-take)}
.tile[data-sec="daily"] .ico,.tile[data-sec="tasks"] .ico{background:var(--c-prod-s);color:var(--c-prod)}
.tile.live[data-sec="att"]{border-top:3px solid var(--c-att)}.tile.live[data-sec="mat"]{border-top:3px solid var(--c-mat)}.tile.live[data-sec="eq"]{border-top:3px solid var(--c-eq)}.tile.live[data-sec="takeoff"]{border-top:3px solid var(--c-take)}
.qk button[data-qk="att"] svg{color:var(--c-att)}.qk button[data-qk="sup"] svg{color:var(--c-mat)}.qk button[data-qk="eq"] svg{color:var(--c-eq)}.qk button[data-qk="exp"] svg{color:var(--c-money)}
.qk button[data-qk="att"]{border-top:3px solid var(--c-att)}.qk button[data-qk="sup"]{border-top:3px solid var(--c-mat)}.qk button[data-qk="eq"]{border-top:3px solid var(--c-eq)}.qk button[data-qk="exp"]{border-top:3px solid var(--c-money)}
.pc{border-inline-start:4px solid #E8C96A}
/* رسومات */
svg.art{fill:none;stroke:#5A7099;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 8px}
svg.art .g{stroke:var(--gold);fill:#FBF1DC}
.empty svg.art{opacity:.95}
h3 svg.art{margin:0}
/* كام جالي؟ */
.tab.kt.on{background:color-mix(in srgb,var(--kc) 14%,#fff);color:color-mix(in srgb,var(--kc) 75%,#000);border-color:color-mix(in srgb,var(--kc) 45%,#fff)}
.kfil{background:#F8FAFD;border:1px solid #E6EAF0;border-radius:14px;padding:8px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.kgrid .in{padding:8px 10px;font-size:14px}
.kmq{font-size:12.5px;padding:4px 10px;background:var(--pri-soft);border-color:var(--pri-line);color:#1F4E8C}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 4px}
.kcard{background:#fff;border:1px solid #E6EAF0;border-top:4px solid var(--kc);border-radius:12px;padding:9px 11px;box-shadow:0 2px 8px rgba(20,40,80,.04)}
.kcard small{color:var(--muted);font-size:12px;display:block}.kcard b{display:block;font-size:22px;font-weight:800;line-height:1.35;white-space:nowrap}.kcard b span{font-size:12px;color:var(--muted);font-weight:600}
.ksec{margin:16px 0 8px;padding:6px 10px;border-radius:9px;border-inline-start:5px solid var(--kc);background:color-mix(in srgb,var(--kc) 9%,#fff);font-size:14.5px}
.ktw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #E6EAF0;border-radius:12px;background:#fff}
.kt2{width:100%;border-collapse:collapse;font-size:13px;min-width:100%}.kt2 th{background:color-mix(in srgb,var(--kc) 12%,#fff);text-align:start;padding:7px 8px;font-size:12.5px;white-space:nowrap}
.kt2 td{padding:7px 8px;border-top:1px solid #EEF1F5;vertical-align:top}.kt2 tr:nth-child(odd) td{background:#FBFCFE}
.kdays{padding:4px 12px}.kday{padding:6px 0;border-bottom:1px dashed #E6EAF0}.kday:last-child{border-bottom:0}.kdh{font-weight:700;font-size:13px;color:#24324D}.kdl{font-size:13.5px;padding:3px 0}
.kans{background:#FFF8E6;border-color:#F0DCA6;font-size:14px;margin-top:8px}

const DEFAULT_EXEC = 'https://script.google.com/macros/s/AKfycbwnuGSvVmsDOeQhQP0NwERUdAPuGeKczGtzsM-vZa5JYeoLzLpGON8kRmPQ1vbO2OcnXQ/exec';

  badInvite:'لينك الدعوة ده مش شغال أو اتستخدم قبل كده. اطلب لينك جديد', pinFormat:'الرقم السري لازم يكون من 4 لـ 8 أرقام',
  token:'الكلمة السرية غلط', ownerExists:'حساب المالك موجود بالفعل', missing:'كمّل الخانات الناقصة',
  phoneExists:'الرقم ده متسجل لحد تاني', role:'الصلاحية دي مش مسموحة', wrongPhone:'ده مش رقم موبايل المالك', denied:'مش من صلاحيتك', session:'سجّل دخول تاني',
  net:'مفيش اتصال بجوجل دلوقتي. جرّب تاني', offline:'مفيش نت، والبيانات دي ما اتنزلتش على الموبايل قبل كده. هتتنزل لوحدها أول ما يبقى فيه نت.', full:'مساحة الموبايل مش كفاية للحفظ من غير نت. امسح حاجات من الموبايل أو استنى النت', slow:'السيرفر اتأخر قوي. جرّب تاني كمان شوية', server:'حصلت مشكلة عند جوجل. جرّب تاني', self:'مينفعش تعمل كده على حسابك', badUser:'الشخص ده مش في الفريق أو صلاحيته مش مناسبة', bigPhoto:'الصورة كبيرة قوي، جرّب صورة تانية', itemExists:'البند ده موجود قبل كده بنفس الاسم', badDates:'تاريخ النهاية لازم يبقى بعد البداية', badPercent:'النسبة لازم تبقى من 0 لـ 100', badNumber:'الرقم مش مظبوط', badAdvance:'الدفعة المقدمة أكبر من قيمة العقد', badIpn:'لينك إنستاباي لازم يبدأ بـ https://ipn.eg/S/ (انسخه زي ما هو من تطبيق إنستاباي)', payType:'اختار نوع الرقم: إنستاباي ولا محفظة', badPhone:'رقم الموبايل مش مظبوط', future:'مينفعش تسجل يوم لسه ما جاش', todayOnly:'تقدر تسجل يوميات النهارده بس', reason:'اكتب سبب الخصم', pendingWorker:'العامل ده لسه مستني تأكيد. اعتمده الأول وبعدين ادفع له', badMap:'اللينك ده مش لينك موقع على خرايط جوجل، أو الموقع مش واضح فيه', backup:'النسخة ما اتعملتش. جرّب تاني', notfound:'مش لاقي ده. اعمل تحديث', pickSupplier:'اختار المورد', truckCap:'العربية دي جديدة: اكتب حمولة النقلة بالمتر المكعب', truckLoads:'اكتب عدد النقلات', truckMissing:'ضيف عربية واحدة على الأقل'
};
const SECTIONS = [
  {k:'att', n:'الحضور', i:'users', live:true},
  {k:'takeoff', n:'الحصر', i:'ruler', live:true},
  {k:'boq', n:'المقايسة والمستخلصات', i:'doc'},
  {k:'exp', n:'المصروفات والعهدة', i:'cash'},
  {k:'mat', n:'التوريدات والخامات', i:'box', live:true},
  {k:'eq', n:'المعدات', i:'truck', live:true},
  {k:'daily', n:'اليومية والصور', i:'camera'},
  {k:'tasks', n:'المهام والاستلام', i:'check'},
  {k:'files', n:'الملفات واللوحات', i:'layers'},
  {k:'client', n:'رابط العميل', i:'link'},
  {k:'acc', n:'حسابات المشروع', i:'chart'}
];
const MORE = [
  {n:'العملاء وفرصهم', i:'users'},
  {n:'الخزن والعهد', i:'wallet'}, {n:'التقارير', i:'chart'}, {n:'أدوات المهندس', i:'tool'}, {n:'دليل الشركة', i:'book'}
];

/* ================= تخزين محلي آمن ================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(LS+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(LS+k); }catch(e){} }
};

/* ================= حالة التطبيق ================= */
const S = {
  user: store.get('user', null),
  session: store.get('session', ''),
  tab: 'home', project: null, taskTab: 'mine',
  masked: store.get('masked', false),
  installEvt: null,
  invite: store.get('pendingInvite', ''),
  hasOwner: null,
  projects: store.get('projects', []), projectsAt: 0, pFilter: 'all', team: null,
  notes: store.get('notes', []), notesAt: 0, items: store.get('items', null)
};

/* ================= أدوات صغيرة ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (id, cls='') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const money = n => `<span class="mv">${Number(n).toLocaleString('en-US')}</span> ج`;
const dn = u => (u && (u.dn || u.name)) || '';
const isBoss = () => S.user && (S.user.role === 'owner' || S.user.role === 'manager');
const isOwner = () => S.user && S.user.role === 'owner';
const canManage = () => isBoss(); /* المدير زي المالك، ماعدا حساب المالك ولينك جوجل والنسخ الاحتياطي */
const device = () => (navigator.userAgent.match(/\(([^)]+)\)/) || ['', 'جهاز'])[1].slice(0, 60);
const execUrl = () => store.get('exec', DEFAULT_EXEC);
const errMsg = r => (r && r.error === 'offline' ? offMsg() : ERR[(r && r.error) || 'server']) + (r && r.left ? ` (فاضل ${r.left} محاولات)` : '');
function offMsg(){ const at = store.get('syncAt', 0);
  return at ? `مفيش نت، والشاشة دي ما نزلتش على الموبايل في آخر تحميل (${new Date(at).toLocaleString('ar-EG', {weekday: 'long', hour: 'numeric', minute: '2-digit'})}). هتنزل لوحدها أول ما يبقى فيه نت.`
    : 'مفيش نت، والموبايل لسه ما نزّلش البيانات ولا مرة. افتح التطبيق مرة بالنت، ومن «الإعدادات» دوس «نزّل كل البيانات دلوقتي».'; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function soon(name){ toast(`«${name}» جاي في مرحلة جاية`); }
const digits = s => String(s || '').replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 1632));
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }

/* ================= الكلام مع جوجل ================= */
// الحاجات التقيلة (النسخة الاحتياطية والتصدير) بتستنى لحد 3 دقايق، والباقي 25 ثانية
const SLOW = {backupNow: 180000, exportTable: 180000, bundle: 180000};
// 0.10.4: كل قراية بتتحفظ على الموبايل، ومن غير نت الشاشة بتفتح بآخر نسخة
const READS = new Set(['siteLog','weekReport','ideas','me','projects','users','attDay','supplyDay','logs','notes','reports','people','workerAccount','wageHistory','attRequests','custodyLedger','custody','collectDues','supplyPending','items','projectAttendance','appPricing']);
function ckey(action, data){ const o = {}, today = ymd(new Date());
  Object.keys(data || {}).sort().forEach(k => { if (['action','session','device','qid','qat'].includes(k)) return; const v = data[k]; if (v === '' || v == null) return; if (k === 'date' && v === today) return; o[k] = v; });
  return action + '|' + JSON.stringify(o); }
async function cachePut(action, data, r){ try { await QDB.put({id: ckey(action, data), r, at: Date.now()}, 'cache'); } catch (e) {} }
async function cacheGet(action, data){ const d = await QDB.open(); if (!d) return null;
  return new Promise(res => { try { const g = d.transaction('cache', 'readonly').objectStore('cache').get(ckey(action, data)); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); } catch (e) { res(null); } }); }
async function fromCache(action, data, err){ const c = await cacheGet(action, data);
  return c ? Object.assign({}, c.r, {offline: true, cachedAt: c.at}) : {ok: false, error: err === 'net' ? 'offline' : err}; }
async function api(action, data = {}){
  if (READS.has(action) && !navigator.onLine) return fromCache(action, data, 'net');
  const r0 = await apiNet(action, data);
  if (READS.has(action)) { if (r0.ok) cachePut(action, data, r0); else if (r0.error === 'net' || r0.error === 'slow') return fromCache(action, data, r0.error); }
  return r0;
}
async function apiNet(action, data = {}){
  const body = Object.assign({action, device: device()}, data);
  if (S.session && !body.session) body.session = S.session;
  const ms = SLOW[action] || 25000, ctl = new AbortController(); let late = false;
  const t = setTimeout(() => { late = true; ctl.abort(); }, ms);
  try {
    const r = await fetch(execUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), signal: ctl.signal});
    return await r.json();
  } catch (e) { return {ok:false, error: late && SLOW[action] ? 'slow' : 'net'}; }   // الباقي يفضل 'net' عشان يتحفظ على الموبايل
  finally { clearTimeout(t); }
}

/* سجل النشاط: بيتحفظ على الموبايل ويتبعت لجوجل أول ما النت يبقى متاح */
function logAct(action, project){
  if (!S.user) return;
  const q = store.get('logq', []);
  q.push({action, project: project || '', at: new Date().toISOString()});
  store.set('logq', q.slice(-300));
  flushLog();
}
let flushing = false;
async function flushLog(){
  if (flushing || !S.session || !navigator.onLine) return;
  const q = store.get('logq', []); if (!q.length) return;
  flushing = true;
  const batch = q.slice(0, 50);
  const r = await api('log', {items: batch});
  if (r.ok) store.set('logq', store.get('logq', []).slice(batch.length));
  flushing = false;
  if (r.ok && store.get('logq', []).length) flushLog();
}
addEventListener('online', flushLog);

/* ================= الحفظ التلقائي =================
   أي عنصر فيه data-ak بيتحفظ مع كل حرف، ويرجع زي ما هو حتى لو التطبيق اتقفل */
function bindAutosave(root){
  root.querySelectorAll('[data-ak]').forEach(el => {
    const key = 'ak.' + el.dataset.ak;
    const v = store.get(key, null);
    if (v !== null) el.value = v;
    el.addEventListener('input', () => {
      store.set(key, el.value);
      const s = root.querySelector(`[data-saved="${el.dataset.ak}"]`);
      if (s) s.textContent = 'اتحفظ على الموبايل ✓';
    });
  });
}

/* شريط الوقت: فات كام يوم من مدة المشروع (أخضر، أصفر من 80%، أحمر لو عدّى النهاية وهو لسه شغال) */
const dayMs = 864e5, today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const pDay = d => new Date(d + 'T00:00:00').getTime();
function timeBar(p){
  if (!p.start || !p.end) return '';
  const s = pDay(p.start), e = pDay(p.end), t = today0(), total = Math.max(1, Math.round((e - s) / dayMs));
  if (t < s) return `<div class="tl">يبدأ بعد ${Math.round((s - t) / dayMs)} يوم · المدة ${total} يوم</div>`;
  const gone = Math.round((t - s) / dayMs), pct = Math.min(100, Math.round(gone / total * 100));
  const late = t > e && p.status === 'جاري', col = late ? 'var(--bad)' : pct >= 80 ? 'var(--warn)' : 'var(--ok)';
  const txt = late ? `<b style="color:var(--bad)">متأخر ${Math.round((t - e) / dayMs)} يوم عن النهاية</b> · المدة ${total} يوم`
    : p.status === 'انتهى' ? `المدة ${total} يوم` : `فات ${gone} يوم من ${total} · <b>${pct}%</b> من الوقت`;
  return `<div class="tl">${txt}<div class="bar"><i style="width:${late ? 100 : pct}%;background:${col}"></i></div></div>`;
}
const pct = (a, b) => (a !== '' && b) ? Math.round(a / b * 100) : null;

const EMPTY_ART = {folder: 'crane', users: 'helmet', truck: 'truck', box: 'truck', tool: 'loader', doc: 'plan', chart: 'chart'};
const emptyBox = (i, t) => `<div class="empty">${EMPTY_ART[i] && typeof art === 'function' ? art(EMPTY_ART[i], 72) : ic(i)}<div>${esc(t)}</div></div>`;

function projectCard(p, asDiv, acts){
  const tag = asDiv ? 'div' : 'button';
  const meta = [p.code, p.short && p.short !== p.name ? p.short : '', p.client, p.type, p.engName ? 'المهندس: ' + p.engName : ''].filter(Boolean).map(esc).join(' · ');

/* حالة النهارده على مربعات الأقسام */
async function loadSecStat(code){
  if (!(canRecord() || canMoney())) return;
  S.secStat = S.secStat || {};
  const old = S.secStat[code]; if (old && Date.now() - old.at < 120000) return;
  S.secStat[code] = Object.assign({}, old, {at: Date.now()});
  const [r, sp] = await Promise.all([api('attDay', {project: code}), canRecord() || canPay() ? api('supplyDay', {project: code}) : Promise.resolve({ok: false})]);
  if (!r.ok) return;
  S.secStat[code] = {at: Date.now(), att: r.rows.length ? 'done' : (r.workers.length ? 'todo' : '')};
  if (sp.ok) secFromSupply(code, sp);
  if (S.project === code && !$('#sheet').classList.contains('on')) render();
}

/* الصورة بتتصغّر على الموبايل قبل ما تتبعت عشان النت */
function shrinkImage(file, max = 1280){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); res(''); };
    img.src = url;
  });
}

function getLoc(ms = 9000){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    let done = false; const t = setTimeout(() => { if (!done) { done = true; res(null); } }, ms);
    navigator.geolocation.getCurrentPosition(p => { if (done) return; done = true; clearTimeout(t); res({lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy}); },
      () => { if (done) return; done = true; clearTimeout(t); res(null); }, {enableHighAccuracy: true, timeout: ms - 500, maximumAge: 60000});
  });
}

/* ---------- الطابور: أي تسجيل من غير نت بيتحفظ على الموبايل ويتبعت لوحده (0.10.3) ----------
   في IndexedDB (بيشيل صور كتير، مش زي localStorage)، وكل تسجيل ليه رقم (qid) والسيرفر بيرفض نفس الرقم مرتين. */
const QDB = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db);
    return new Promise(res => { try { const r = indexedDB.open('mecq', 2);
      r.onupgradeneeded = () => { const d = r.result; ['q', 'bad', 'cache'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath: 'id'}); }); };
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => res(null); } catch (e) { res(null); } }); },
  async tx(st, mode, fn){ const d = await this.open(); if (!d) return null;
    return new Promise(res => { try { const t = d.transaction(st, mode), o = t.objectStore(st), r = fn(o); t.oncomplete = () => res(r && 'result' in r ? r.result : true); t.onerror = () => res(null); t.onabort = () => res(null); } catch (e) { res(null); } }); },
  all(st = 'q'){ return this.tx(st, 'readonly', o => o.getAll()).then(x => (x || []).sort((a, b) => a.at - b.at)); },
  put(it, st = 'q'){ return this.tx(st, 'readwrite', o => o.put(it)); },
  del(id, st = 'q'){ return this.tx(st, 'readwrite', o => o.delete(id)); }
};
const qid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
S.qn = 0; S.qbad = 0;

function qBadge(){ const el = $('#qBtn'); const n = S.qn + S.qbad;
  if (!n) { if (el) el.remove(); return; }
  const html = `<button class="ibtn" id="qBtn" aria-label="مستني النت" title="مستني النت" style="width:auto;padding:0 8px;font-size:13px;font-weight:700;color:${S.qbad ? 'var(--bad)' : 'var(--gold)'}">⏳ ${n}</button>`;
  if (el) el.outerHTML = html; else if ($('#bellBtn')) $('#bellBtn').insertAdjacentHTML('beforebegin', html);
  $('#qBtn').onclick = queueSheet; }
// الحفظ: لو فيه نت بيتبعت على طول، ولو مفيش (أو النت قطع) بيتحفظ في الطابور ويرجع {ok, queued}
async function qSave(action, body, label){
  body = Object.assign({}, body, {qid: body.qid || qid(), qat: body.qat || new Date().toISOString()});
  if (navigator.onLine) { const x = await api(action, body); if (x.ok || x.error !== 'net') return x; }

}

// بيرجع عدد الشاشات اللي نزلت، أو null لو ما اشتغلش (مفيش نت أو مش داخل)
async function syncAll(force, prog){
  if (syncing || !navigator.onLine || !S.session || !S.user) return null;
  if (!force && Date.now() - store.get('syncAt', 0) < 8 * 60000) return null;
  syncing = true; let n = 0, fail = 0, stop = false;
  // طلب واحد لجوجل؛ ولو جوجل القديم رفضه (Auth.gs لسه ما اتركّبش) بيحمّل واحدة واحدة
  const one = async it => { const {action, ...d} = it; const x = await api(action, d); if (x.ok && !x.offline) n++; else { fail++; if (x.error === 'net' || x.error === 'slow' || x.error === 'session') stop = true; } return x; };
  const sendB = async items => { if (stop || !items.length) return [];
    if (!S.noBundle) { const r = await api('bundle', {items});
      if (r.ok && Array.isArray(r.results)) { r.results.forEach((x, i) => { if (x && x.ok) { cachePut(items[i].action, items[i], x); n++; } else fail++; }); if (prog) prog(n); return r.results; }
      if (r.error === 'net' || r.error === 'slow' || r.error === 'session') { stop = true; return []; }
      S.noBundle = true; }
    const out = []; for (let i = 0; i < items.length && !stop; i += 4) { out.push(...await Promise.all(items.slice(i, i + 4).map(one))); if (prog) prog(n); }
    return out; };
  try {
    const R = role(), money = ['owner','manager','accountant','engineer'].includes(R), T = ['L','C','S','E'];
    const base = [{action: 'projects'}, {action: 'notes'}, {action: 'items'}].concat(T.map(type => ({action: 'people', type})), [{action: 'custody'}]);
    if (isBoss()) base.push({action: 'collectDues', project: ''}, {action: 'supplyPending'}, {action: 'attRequests'}, {action: 'users'});
    if (['owner','manager','engineer','supervisor','accountant'].includes(R)) base.push({action: 'siteLog'});
    if (isBoss() || R === 'accountant' || R === 'engineer') base.push({action: 'weekReport'});
    if (R === 'owner') base.push({action: 'ideas'});
    const r1 = await sendB(base); if (stop || !r1.length) return n;
    if (r1[0] && r1[0].ok) { S.projects = r1[0].items; S.projectsAt = Date.now(); store.set('projects', r1[0].items); }
    { const i = base.findIndex(x => x.action === 'siteLog'), x = r1[i]; if (i >= 0 && x && x.ok) S.siteLog = Object.assign({}, x, {at: Date.now()}); }
    { const i = base.findIndex(x => x.action === 'ideas'), x = r1[i]; if (i >= 0 && x && x.ok) { S.ideas = x; store.set('ideasN', x.items.filter(y => ['جديدة', 'بفكر فيها'].includes(y.st)).length); } }
    T.forEach((t, i) => { const x = r1[3 + i]; if (x && x.ok) S.people[t] = x.items; });
    // كل المشاريع اللي ما خلصتش: يوميات وتوريدات ومعدات النهارده، وحساب كل عامل ومعدة ومورد عليها، وكشوف العهد
    const projs = (S.projects || []).filter(p => p.status !== 'انتهى').slice(0, 25), codes = projs.map(p => p.code);
    const more = [];
    projs.forEach(p => { more.push({action: 'attDay', project: p.code}, {action: 'supplyDay', project: p.code}); if (isBoss()) more.push({action: 'collectDues', project: p.code}); });
    const cu = r1[7]; ((cu && cu.ok && cu.items) || []).slice(0, 30).forEach(x => more.push({action: 'custodyLedger', userId: x.id}));
    if (money) ['L','E','S'].forEach(t => { const x = r1[3 + T.indexOf(t)];
      ((x && x.ok && x.items) || []).filter(w => w.status !== 'مستني تأكيد' && !w.mergedInto && (isBoss() || R === 'accountant' || !w.project || codes.some(c => String(w.project).indexOf(c) >= 0)))
        .slice(0, 60).forEach(w => more.push({action: 'workerAccount', code: w.code})); });
    for (let i = 0; i < more.length && !stop; i += 20) { if (!navigator.onLine) break; await sendB(more.slice(i, i + 20)); }

}

/* ---------- الإيصال الحراري (صورة) ---------- */
function receiptData(a, pay){
  const pays = a.moves.filter(m => m.type === 'دفع');

  const upto = (m) => m.date < pay.date || (m.date === pay.date && m.at <= pay.at);
  const fromD = prev ? prev.date : '0000';
  const conf = a.days.filter(d => d.state === 'مؤكد');
  const winDays = conf.filter(d => d.date > fromD && d.date <= pay.date);
  const before = conf.filter(d => d.date <= fromD);
  const mvBefore = a.moves.filter(m => m.id !== pay.id && (!prev ? false : !after(m, prev)));
  const carried = !prev ? a.total.opening : a.total.opening + before.reduce((s, d) => s + d.amount, 0) - mvBefore.reduce((s, m) => s + m.amount, 0);
  const mvWin = a.moves.filter(m => m.id !== pay.id && m.type !== 'دفع' && (!prev || after(m, prev)) && upto(m));

  const byProj = {}; mDays.forEach(d => byProj[d.projName] = (byProj[d.projName] || 0) + ({'كامل':1,'نص':0.5}[d.st] || 0));
  const projs = [...new Set(winDays.map(d => d.projName))];
  return {pay, prev, carried, last, olderWeeks, mvWin, earned, due, left: due - pay.amount, month, byProj, projs, multi: projs.length > 1};
}

/* إيصال دفع لمعدة أو مورد: الشغل من آخر دفعة، والإجمالي والمدفوع والباقي */
async function drawSupplyReceipt(a, pay){
  const w = a.worker, W = 576, pad = 28, isS = a.kind === 'S';
  const pays = a.moves.filter(m => m.type === 'دفع'), idx = pays.findIndex(m => m.id === pay.id), prev = idx > 0 ? pays[idx - 1] : null;
  const upto = m => m.date < pay.date || (m.date === pay.date && m.at <= pay.at);
  const earnedTo = a.days.filter(d => d.date <= pay.date).reduce((s, d) => s + d.amount, 0);
  const movedBefore = a.moves.filter(m => m.id !== pay.id && upto(m)).reduce((s, m) => s + m.amount, 0);
  const due = earnedTo - movedBefore, left = due - pay.amount;
  const win = a.days.filter(d => d.date <= pay.date && (!prev || d.date > prev.date)).slice(-12);

  L('رقم الإيصال', pay.receipt, {}); L('التاريخ', new Date(pay.at || pay.date).toLocaleString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}));
  L(isS ? 'المورد' : 'المعدة', w.name + (w.trade ? ' — ' + w.trade : '')); dash();
  if (win.length) { L(isS ? 'التوريدات من آخر دفعة' : 'الشغل من آخر دفعة', '', {b: true}); win.forEach(d => L(`${new Date(d.date + 'T00:00:00').getDate()}/${new Date(d.date + 'T00:00:00').getMonth() + 1} ${d.desc}`, d.noPrice ? '—' : nf(d.amount), {small: true})); dash(); }
  L('إجمالي له', nf(due)); L('المدفوع', nf(pay.amount) + ' EGP', {b: true, sz: 28}); L('الباقي له', nf(left)); dash();
  L('طريقة الدفع', pay.method); L('دفع بواسطة', pay.by + (pay.source ? ' — ' + pay.source.replace(/^عهدة .*/, 'من العهدة') : ''));
  gap(16); L('توقيع المستلم', ''); gap(40); lines.push({sign: true}); gap(10); dash(); L('MEC — شكرا', '', {c: true, sz: 20});
  const lh = o => o.dash ? 22 : o.gap ? o.gap : o.sign ? 4 : (o.small ? 19 : (o.sz || 22)) + 16;
  const cv = document.createElement('canvas'), x = cv.getContext('2d'), logoH = 120, H = pad + logoH + lines.reduce((s, o) => s + lh(o), 0) + pad;
  const font = (sz, b) => `${b ? 'bold ' : ''}${sz}px Cairo, "Noto Naskh Arabic", Tahoma, sans-serif`;
  cv.width = W; cv.height = H; x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = '#111'; x.direction = 'rtl';
  try { const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'logo-512.png'; }); x.drawImage(img, W / 2 - 55, pad, 110, 110); } catch (e) {}
  let y = pad + logoH;
  for (const o of lines) { const h = lh(o);
    if (o.dash) { x.setLineDash([6, 5]); x.beginPath(); x.moveTo(pad, y + 11); x.lineTo(W - pad, y + 11); x.stroke(); x.setLineDash([]); }
    else if (o.sign) { x.beginPath(); x.moveTo(pad, y); x.lineTo(W - pad - 160, y); x.stroke(); }
    else if (!o.gap) { const sz = o.small ? 19 : (o.sz || 22); x.font = font(sz, o.b); const base = y + sz + 6;

    y += h; }

  return cv;
}

/* صورة صغيرة مربعة (حوالي 5 كيلو) بتتحفظ في الشيت نفسه */
function squareThumb(file, size = 112){
  return new Promise(res => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = size; const k = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, size, size); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); res(''); }; img.src = url; });
}

const NOTES = [200, 100, 50, 20, 10, 5];
function changeCalc(amounts){
  const cnt = {}; amounts.forEach(a => { let left = Math.round(a); NOTES.forEach(n => { const k = Math.floor(left / n); if (k) { cnt[n] = (cnt[n] || 0) + k; left -= k * n; } }); });
  return NOTES.filter(n => cnt[n]).map(n => `${cnt[n]} × ${n}`).join(' · ');
}

      </div></div>`).join('') || `<div class="card empty" style="padding:18px">${ic('truck')}<div>${r.date === r.today ? 'فيه نقلات النهارده؟ 🚚' : 'مفيش توريدات في اليوم ده'}</div></div>`}

  document.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => deliveryForm(code, r.date, r.recent[Number(b.dataset.rec)]));
  document.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => fixDelivery(r.rows.find(x => x.id === b.dataset.fix), () => supplySheet(code, r.date)));

  if ($('#spPend')) $('#spPend').onclick = pendingSupplySheet;
}

        ${ch && (!lp || ch.price < lp.price) ? `<small style="display:block;color:var(--ok)">أرخص سعر من مورد تاني: ${nf(ch.price)} ج · ${esc(ch.supName)}</small>` : ''}
        <small class="muted" style="display:block">لو السعر مش معروف دلوقتي سيبه فاضي، وهيوصل تنبيه يتكمّل.</small>` : ''}
      <label class="btn ghost" style="margin-top:10px;display:flex;justify-content:center;gap:8px">${ic('camera')} صورة البون (اختياري)${f.bon ? ' ✓' : ''}<input type="file" id="dlBon" accept="image/*" capture="environment" hidden></label>
      <label class="f">ملاحظة</label><div class="row" style="gap:6px"><input class="in" id="dlNote" value="${esc(f.note)}">${micBtn('dlNote')}</div>
      ${canRecvFor() ? recvField('dlRecv', f.recv, findProject(code)) : ''}

    if (canRecvFor()) wireRecv('dlRecv', v => { f.recv = v; });
    $('#sheetBody').scrollTop = y;
    wireMics($('#sheetBody'));
    const sync = () => { if ($('#dlMat')) f.mat = $('#dlMat').value; if ($('#dlCnt')) f.count = $('#dlCnt').value; if ($('#dlSize')) f.size = $('#dlSize').value;

      document.querySelectorAll('[data-tl]').forEach(i => f.trucks[i.dataset.tl].loads = i.value);
      document.querySelectorAll('[data-tc]').forEach(i => f.trucks[i.dataset.tc].cap = i.value); };
    // «آخر مرة كانت مع فلان»: من رقم العربية، أو من آخر توريدة لنفس الخامة — والمورد يفضل مفتوح لحد ما تأكد
    const sugSup = () => { if (f.sup) return null;
      for (const t of f.trucks) { const k = t.plate ? known(t.plate) : null; if (k && k.sup && supName(k.sup)) return {code: k.sup, why: 'العربية ' + t.plate}; }
      if (f.mat) { const h = (day.prices || []).filter(x => normAr(x.mat) === normAr(f.mat)).sort((a, b) => b.date.localeCompare(a.date))[0] || (day.recent || []).find(x => normAr(x.mat) === normAr(f.mat));
        if (h && supName(h.sup)) return {code: h.sup, why: f.mat}; }
      return null; };
    const drawSug = () => { const el = $('#dlSupSug'); if (!el) return; const g = sugSup();
      el.innerHTML = g ? `<button class="chip" id="dlSupOk" style="margin-bottom:6px;background:#FFF4D6">آخر مرة (${esc(g.why)}) كانت مع <b>&nbsp;${esc(supName(g.code))}</b>&nbsp;· ✓ تأكيد</button>` : '';
      if (g) $('#dlSupOk').onclick = () => { sync(); f.sup = g.code; f.price = ''; draw(); }; };
    drawSug();
    document.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { sync(); f.mat = b.dataset.mt; draw(); });
    // الحديد: القطر بيتكتب في اسم الخامة («حديد 12») عشان التقرير يطلّع الطن لكل قطر
    const dmDraw = () => { const el = $('#dlDm'), m = ($('#dlMat') || {}).value || ''; if (!el) return;

      el.querySelectorAll('[data-dm]').forEach(b => b.onclick = () => { sync(); f.mat = 'حديد ' + b.dataset.dm; if (!f.unit || f.unit === 'نقلة') f.unit = 'طن'; draw(); }); };
    dmDraw(); if ($('#dlMat')) $('#dlMat').addEventListener('input', dmDraw);
    if ($('#dlSupQ')) { const q = $('#dlSupQ'); const list = () => { const v = normAr(q.value);

        $('#dlSupL').innerHTML = (S.noList && S.noList.S ? `<p class="muted" style="font-size:13px;margin:6px 2px">${NOLIST}</p>` : '')
          + l.map(s => `<button class="li" data-sp="${esc(s.code)}"><span class="t"><b>${esc(s.name)}${s.tmp ? ' <small class="pill p-warn">⏳ مستني النت</small>' : ''}</b><small>${esc(s.goods || '')}</small></span></button>`).join('')
          + `<button class="li" id="dlSupNew"><span class="ico">${ic('plus')}</span><span class="t"><b>مورد جديد${q.value ? ': ' + esc(q.value) : ''}</b></span></button>`;
        document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { sync(); f.sup = b.dataset.sp; f.price = ''; draw(); });
        $('#dlSupNew').onclick = () => { sync(); S.afterPerson = pp => { if (!pp.tmp) S.people.S = null; (pp.tmp ? Promise.resolve(S.people.S) : loadPeople('S', true)).then(l2 => { const L = (l2 || []).slice(); if (!L.some(x => x.code === pp.code)) L.unshift(pp); sups.splice(0, sups.length, ...L); f.sup = pp.code; draw(); }); };
          personForm('S', null, false, {name: q.value}); }; };
      q.oninput = list; list(); }
    if ($('#dlSupX')) $('#dlSupX').onclick = () => { sync(); f.sup = ''; draw(); };
    document.querySelectorAll('[data-un]').forEach(b => b.onclick = () => { sync(); f.unit = b.dataset.un; f.size = f.unit === 'شيكارة' && isCement(f.mat) && !f.size ? '50' : (U_SIZE[f.unit] ? f.size : ''); f.price = ''; draw(); });
    // تغيير الخامة ما بيعيدش رسم الفورمة (عشان الدوسة اللي بعدها ما تضيعش)
    if ($('#dlMat')) $('#dlMat').onchange = () => { sync();
      if (f.unit === 'شيكارة' && isCement(f.mat) && !f.size && $('#dlSize')) { f.size = '50'; $('#dlSize').value = '50'; }
      if ($('#dlPrice') && !$('#dlPrice').value && f.sup) { const lp = lastPrice(f.sup, f.mat, f.priceOn); if (lp) { f.price = String(lp.price); $('#dlPrice').value = f.price; } }
      drawSug(); };
    if ($('#dlOn')) $('#dlOn').onchange = () => { sync(); f.price = ''; draw(); };
    // رقم العربية: لو معروفة الحمولة تتملى مكانها من غير ما الفورمة تترسم تاني
    document.querySelectorAll('[data-tp]').forEach(i => i.oninput = () => { const n = i.dataset.tp, k = known(i.value), c = document.querySelector(`[data-tc="${n}"]`), l = document.querySelector(`[data-tcl="${n}"]`);
      f.trucks[n].plate = i.value;
      if (k && k.cap !== '') { if (c && !c.value) c.value = k.cap; if (l) l.innerHTML = '<b style="color:var(--ok)">(معروفة)</b>'; }
      else if (l) l.innerHTML = i.value ? '<b style="color:var(--warn)">(جديدة: لازم)</b>' : '';
      drawSug(); });
    document.querySelectorAll('[data-tph]').forEach(i => i.onchange = async e => { const fl = e.target.files[0]; if (!fl) return; sync(); f.trucks[i.dataset.tph].photo = await shrinkImage(fl, 900); draw(); });
    document.querySelectorAll('[data-tx]').forEach(b => b.onclick = () => { sync(); f.trucks.splice(Number(b.dataset.tx), 1); draw(); });
    if ($('#dlAddT')) $('#dlAddT').onclick = () => { sync(); f.trucks.push({plate: '', loads: '1', cap: '', photo: ''}); draw(); };
    $('#dlBon').onchange = async e => { const fl = e.target.files[0]; if (!fl) return; sync(); f.bon = await shrinkImage(fl, 1400); draw(); };
    if ($('#dlVoice')) $('#dlVoice').onclick = () => { sync(); $('#dlVoice').classList.add('on'); listen(t => { const v = parseSupplyVoice(t, sups);
        if (v.sup) f.sup = v.sup; if (v.mat) f.mat = v.mat; if (v.unit) f.unit = v.unit;
        if (v.count) { if (f.unit === 'نقلة') f.trucks[0].loads = String(v.count); else f.count = String(v.count); }
        if (v.price && canPay()) f.price = String(v.price);
        draw(); toast('فهمت: ' + t + ' — راجع وسجّل'); }, () => { const b = $('#dlVoice'); if (b) b.classList.remove('on'); }); };
    $('#dlSave').onclick = async () => {
      sync(); $('#dlErr').textContent = '';
      if (!f.sup) { $('#dlErr').textContent = ERR.pickSupplier; return; }
      if (!f.mat.trim()) { $('#dlErr').textContent = 'اكتب الخامة'; return; }
      const del = {sup: f.sup, mat: f.mat, unit: f.unit, note: f.note, bon: f.bon};
      if (f.unit === 'نقلة') {
        del.trucks = f.trucks.map(t => ({plate: t.plate, loads: numIn(t.loads), cap: numIn(t.cap), photo: t.photo}));
        const bad = del.trucks.find(t => !(Number(t.loads) >= 1) || (!(Number(t.cap) > 0) && !(t.plate && known(t.plate) && known(t.plate).cap !== '')));
        if (bad) { $('#dlErr').textContent = !(Number(bad.loads) >= 1) ? ERR.truckLoads : ERR.truckCap; return; }
      } else {
        del.count = numIn(f.count); if (!(Number(del.count) > 0)) { $('#dlErr').textContent = 'اكتب العدد'; return; }
        if (U_SIZE[f.unit]) del.size = numIn(f.size);
      }
      if (canPay()) { del.price = numIn(f.price); del.priceOn = f.priceOn; }
      busy($('#dlSave'), true);
      const loc = await getLoc();
      const body = {project: code, date, del, loc, at: new Date().toISOString(), recv: f.recv || ''};
      body.qid = body.qid || qid(); const x = navigator.onLine ? await api('saveDelivery', body) : {ok: false, error: 'net'};
      busy($('#dlSave'), false);
      if (!x.ok && x.error === 'net') {   // من غير نت: تتحفظ على الموبايل وتتبعت لوحدها
        if (!outPush('saveDelivery', body, 'توريدة ' + f.mat)) { $('#dlErr').textContent = 'مفيش نت، والموبايل مش قادر يحفظ الصور دي. شيل صورة وجرّب تاني'; return; }
        toast('مفيش نت: التوريدة اتحفظت على الموبايل وهتتبعت أول ما النت يرجع 📶'); closeSheet(); S.redraw = true; return; }
      if (!x.ok) { $('#dlErr').textContent = errMsg(x) + (x.plate ? ` (${x.plate})` : ''); return; }
      S.supDay = null; toast('اتسجلت التوريدة ✓' + (x.state === 'مبدئي' ? ' (مبدئي)' : ''));
      if (S.secStat) delete S.secStat[code]; S.quickAt = 0; S.redraw = true;
      (x.warnings || []).forEach((w, i) => setTimeout(() => toast(w), 2600 * (i + 1)));
      if (!del.bon && x.id) return askBon(x.id, () => supplySheet(code, date));
      supplySheet(code, date);
    };
  };
  draw();
}

/* «3 نقلات رمل من الجوهرة» · «40 شيكارة أسمنت من السلام بـ 90» */
const NUMA = {'واحد':1,'واحده':1,'نقله':1,'اتنين':2,'اثنين':2,'نقلتين':2,'تلاته':3,'ثلاثه':3,'تلات':3,'اربعه':4,'اربع':4,'خمسه':5,'خمس':5,'سته':6,'ست':6,'سبعه':7,'سبع':7,'تمنيه':8,'ثمانيه':8,'تسعه':9,'عشره':10,'عشرين':20,'تلاتين':30,'اربعين':40,'خمسين':50,'ميه':100};
const UNIT_W = [[/نقل(ه|ات|تين)?/, 'نقلة'], [/شكاير|شيكار(ه|ات)?|شكار(ه)?/, 'شيكارة'], [/كراتين|كرتون(ه|ات)?/, 'كرتونة'], [/جرادل|جردل/, 'جردل'], [/متر مكعب|م3|مكعب/, 'م3'], [/متر مربع|م2/, 'م2'], [/طن|اطنان/, 'طن'], [/متر طولي/, 'متر طولي']];
function parseSupplyVoice(text, sups){
  const t = ' ' + normAr(digits(text)).replace(/[،,.]/g, ' ') + ' ', out = {};
  let unitAt = -1, unitLen = 0;
  for (const [re, u] of UNIT_W) { const m = t.match(re); if (m) { out.unit = u; unitAt = m.index; unitLen = m[0].length; if (/نقلتين/.test(m[0])) out.count = 2; break; } }
  const head = unitAt >= 0 ? t.slice(0, unitAt) : t;
  const nm = head.match(/(\d+(?:\.\d+)?)\s*$/) || head.match(/(\d+(?:\.\d+)?)/);
  if (!out.count && nm) out.count = Number(nm[1]);
  if (!out.count) for (const [w, n] of Object.entries(NUMA)) if (head.includes(' ' + w + ' ')) { out.count = n; break; }
  if (!out.count && out.unit === 'نقلة') out.count = 1;
  const pm = t.match(/(?:ب|بسعر|السعر)\s*(\d+(?:\.\d+)?)/); if (pm) out.price = Number(pm[1]);
  const fromI = t.indexOf(' من ');
  const rest = unitAt >= 0 ? t.slice(unitAt + unitLen, fromI > unitAt ? fromI : undefined) : (fromI > 0 ? t.slice(0, fromI) : '');
  const mat = rest.replace(/\d+/g, '').replace(/\s+/g, ' ').trim(); if (mat) out.mat = mat.split(' ').slice(0, 3).join(' ');
  if (fromI >= 0) { const after = t.slice(fromI + 4);
    const hit = sups.map(s => { const n = normAr(s.name), words = n.split(' ').filter(w => w.length > 2 && !['شركه','مصنع','الحاج'].includes(w));
      const score = after.includes(n) ? 10 : words.filter(w => after.includes(w)).length; return {s, score}; }).filter(x => x.score > 0).sort((a, b) => b.score - a.score)[0];
    if (hit) out.sup = hit.s.code; }
  return out;
}

/* «اللودر 6 ساعات، الخلاطة يوم» */
function parseEqVoice(text, list){
  const t = ' ' + normAr(digits(text)).replace(/[،,.]/g, ' ') + ' ', out = {};
  const pos = list.map(e => { const keys = [normAr(e.name), normAr(e.etype || ''), normAr(e.name).split(' ')[0]].filter(k => k.length > 1);
    for (const k of keys) { const i = t.indexOf(k); if (i >= 0) return {e, i, len: k.length}; } return null; }).filter(Boolean).sort((a, b) => a.i - b.i);
  pos.forEach((x, n) => { const seg = t.slice(x.i + x.len, n + 1 < pos.length ? pos[n + 1].i : t.length);
    const m = seg.match(/(\d+(?:\.\d+)?)/); let q = m ? Number(m[1]) : 0;
    if (!q) { if (/ساعتين|يومين|نقلتين/.test(seg)) q = 2; else for (const [w, k] of Object.entries(NUMA)) if (seg.includes(' ' + w + ' ')) { q = k; break; } }
    if (!q && /ساعه|يوم|نقله/.test(seg)) q = 1;
    if (/نص/.test(seg)) q = q ? q + 0.5 : 0.5;
    if (!q && (x.e.unit || 'يوم') === 'يوم') q = 1;
    if (q) out[x.e.code] = q; });
  return out;
}

/* ---------- وضع الشمس: سطر صغير لو انت في الموقع ---------- */
async function sunHint(){
  if (store.get('sun', false) || store.get('sunAsk', '') === ymd(new Date()) || $('#sunHint') || !S.user) return;
  try { if (navigator.permissions) { const ps = await navigator.permissions.query({name: 'geolocation'}); if (ps.state !== 'granted') return; } } catch (e) { return; }
  const ps = myActive().filter(p => p.lat !== '' && p.lat !== undefined); if (!ps.length) return;
  const loc = await getLoc(6000); if (!loc) return;
  const near = ps.some(p => Math.hypot((p.lat - loc.lat) * 111000, (p.lng - loc.lng) * 111000 * Math.cos(loc.lat * Math.PI / 180)) < 300);
  if (!near || $('#sunHint') || store.get('sun', false)) return;
  store.set('sunAsk', ymd(new Date()));
  const top = $('header.top'); if (!top) return;
  top.insertAdjacentHTML('afterend', `<div id="sunHint" class="sunhint"><span style="flex:1">انت في الموقع، تشغّل وضع الشمس؟</span><button id="sunYes">☀️ شغّل</button><button id="sunNo" aria-label="اقفل">✕</button></div>`);
  $('#sunYes').onclick = () => { store.set('sun', true); document.body.classList.add('sun'); $('#sunHint').remove(); render(); };
  $('#sunNo').onclick = () => $('#sunHint').remove();
}

function listen(onText, onEnd){

/* «سعيد كامل، كريم نص وساعتين، ممدوح غياب» أو «الكل كامل ما عدا كريم غياب» */
const NUMW = {'ساعه':1,'ساعة':1,'ساعتين':2,'تلات':3,'ثلاث':3,'اربع':4,'أربع':4,'خمس':5,'ست':6};
function parseVoice(text, list){
  const t = ' ' + normAr(text).replace(/[،,.]/g, ' ') + ' ';
  const stOf = s => /غياب|غايب|مجاش|ما جاش|مجاش/.test(s) ? 'غياب' : /نص|نصف/.test(s) ? 'نص' : /كامل|حاضر|جه|موجود/.test(s) ? 'كامل' : '';
  const hrOf = s => { const m = s.match(/(\d+)\s*ساع/); if (m) return Number(m[1]); for (const [w, n] of Object.entries(NUMW)) if (s.includes(w)) return n; return 0; };
  const out = {};
  const allM = t.match(/(الكل|كلهم)\s+(\S+)/); if (allM) { const st = stOf(allM[2]); if (st) list.forEach(w => out[w.code] = {st, hours: 0}); }
  const pos = list.map(w => { const parts = normAr(w.name).split(' '); const keys = [parts.slice(0, 2).join(' '), parts[0]]; let i = -1, k = '';
    for (const key of keys) { i = t.indexOf(' ' + key + ' '); if (i >= 0) { k = key; break; } } return {w, i, len: k.length}; }).filter(x => x.i >= 0).sort((a, b) => a.i - b.i);
  pos.forEach((x, n) => { const seg = t.slice(x.i + x.len + 1, n + 1 < pos.length ? pos[n + 1].i : t.length); const st = stOf(seg); if (st) out[x.w.code] = {st, hours: hrOf(seg)}; });
  return out;
}
function voiceAttendance(list, state, redraw){
  const box = $('#atVoiceOut'); box.innerHTML = `<div class="card" style="font-size:13.5px">${ic('mic')} اتكلم دلوقتي… مثلا: «سعيد كامل، كريم نص وساعتين، ممدوح غياب» أو «الكل كامل ما عدا كريم غياب»</div>`;
  listen(text => { const res = parseVoice(text, list); const n = Object.keys(res).length;
    box.innerHTML = `<div class="card" style="font-size:13.5px"><b>سمعت:</b> «${esc(text)}»<br>${n ? `اتفهم ${n} عامل. راجع وسجّل.` : 'ما عرفتش أطلّع أسامي. جرّب تقول اسم العامل وبعده كامل أو نص أو غياب.'}</div>`;
    Object.entries(res).forEach(([c, v]) => { if (state[c]) state[c] = v; }); if (n) { redraw(); $('#atVoiceOut').innerHTML = box.innerHTML; } }, () => {});
}

let logoData = null;
async function logoURL(){ if (logoData !== null) return logoData; try { const b = await (await fetch('icon-192.png')).blob(); logoData = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(''); fr.readAsDataURL(b); }); } catch (e) { logoData = ''; } return logoData; }
function dl64(b64, type, name){ const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u], {type})); a.download = name; a.click(); }
async function exportFile(title, sub, head, rows, name){
  if (!navigator.onLine) return false;
  const x = await api('exportTable', {title, sub, head, rows, name, logo: await logoURL()});
  if (!x.ok || !x.xlsx) return false;
  dl64(x.xlsx, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', name + '.xlsx');
  if (x.pdf) setTimeout(() => dl64(x.pdf, 'application/pdf', name + '.pdf'), 600);
  toast('نزل الإكسيل' + (x.pdf ? ' والـ PDF' : '') + ' ✓'); return true;
}

        <div style="font-size:12.5px;margin-top:4px"><span style="color:var(--ok)">＋ ${esc(w.pros)}</span><br><span style="color:var(--bad)">－ ${esc(w.cons)}</span></div></div>`).join('')}
      ${a.best ? `<div style="margin-top:8px;font-size:14px"><b>⭐ الأحسن:</b> ${esc(a.best)}</div>` : ''}${a.where ? `<div style="margin-top:4px;font-size:13.5px"><b>📍 فين:</b> ${esc(a.where)}</div>` : ''}
      ${aiList('👣 أول خطوات', a.steps, '→')}${aiList('🔗 أفكار مرتبطة', a.related)}${aiList('⚠️ مخاطر', a.risks)}</div>` : ''}
      ${(x.thread || []).map(t => `<div class="card" style="margin-top:8px;padding:10px 12px"><div style="font-size:13px;color:var(--pri);font-weight:700">انت: ${esc(t.q)}</div><div style="font-size:14px;margin-top:4px;white-space:pre-wrap">${esc(t.a)}</div>${aiList('', t.steps, '→')}</div>`).join('')}</div>
    <button class="btn gold" id="ivThink" style="margin-top:10px">🤖 ${a ? 'فكّر فيها تاني' : 'فكّر فيها'}</button>
    ${a ? `<div class="row" style="gap:6px;margin-top:8px"><input class="in" id="ivQ" placeholder="اسأل تاني: طب لو…؟" style="flex:1">${micBtn('ivQ')}<button class="mic" id="ivAsk" aria-label="اسأل">${ic('send')}</button></div>` : ''}
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost" id="ivCopy" style="flex:2">📋 انسخ لـ Claude</button><button class="btn ghost" id="ivEdit" style="flex:1">تعديل</button><button class="btn ghost" id="ivDel" style="flex:1;color:var(--bad)">امسح</button></div>`);
  wireMics($('#sheetBody'));
  $('#ivBack').onclick = () => ideasSheet();
  document.querySelectorAll('[data-ivs]').forEach(b => b.onclick = async () => { const r = await qSave('saveIdea', {idea: {id: x.id, st: b.dataset.ivs}}, 'حالة فكرة'); if (!r.ok) { toast(errMsg(r)); return; } x.st = b.dataset.ivs;
    store.set('ideasN', S.ideas.items.filter(y => ['جديدة', 'بفكر فيها'].includes(y.st)).length); toast(r.queued ? QMSG : 'اتغيرت ✓'); ideaView(x.id); });
  const ai = async q => { if (S.ivBusy) return; if (x.q) { toast('الفكرة لسه ما اتبعتتش، استنى النت'); return; } if (!navigator.onLine) { toast('الذكاء الاصطناعي محتاج نت'); return; }
    S.ivBusy = true; try { await ai2(q); } finally { S.ivBusy = false; } };
  const ai2 = async q => {
    const b = q ? $('#ivAsk') : $('#ivThink'); busy(b, true); if (!q) b.textContent = '🤖 بيفكر… (ممكن ياخد دقيقة)';
    const r = await api('thinkIdea', Object.assign({id: x.id}, q ? {q} : {})); if (!$('#ivThink')) return; busy(b, false);
    if (!r.ok) { toast(r.error === 'noAI' ? 'مفتاح Gemini مش متركّب (setupGemini)' : r.error === 'ai' ? 'الذكاء الاصطناعي ما ردّش، جرّب تاني' : errMsg(r)); if (!q) b.textContent = '🤖 فكّر فيها'; return; }
    S.ideas.items = S.ideas.items.map(y => y.id === x.id ? r.idea : y); ideaView(x.id); setTimeout(() => { const el = q ? document.querySelector('#ivAi .card:last-child') : $('#ivAi'); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }, 80); };
  $('#ivThink').onclick = () => ai('');
  if ($('#ivAsk')) { $('#ivAsk').onclick = () => { const q = ($('#ivQ').value || '').trim(); if (q) ai(q); }; $('#ivQ').addEventListener('change', () => { const q = ($('#ivQ').value || '').trim(); if (q) ai(q); }); }
  $('#ivCopy').onclick = () => copyClaude([x]);
  $('#ivEdit').onclick = () => ideaForm(x);
  $('#ivDel').onclick = async () => { if (!confirm('تمسح الفكرة دي؟')) return; const r = await qSave('delIdea', {id: x.id}, 'مسح فكرة'); if (!r.ok) { toast(errMsg(r)); return; } S.ideas.items = S.ideas.items.filter(y => y.id !== x.id); toast('اتمسحت'); ideasSheet(); };
  if (think && navigator.onLine) ai('');
}
// نص واحد فيه الأفكار وردود الذكاء الاصطناعي، يتلزق في محادثة Claude
async function copyClaude(L){
  const txt = '📒 من «دفتري» في MEC-APP (' + ymd(new Date()) + '):\n\n' + L.map((x, i) => {
    const a = x.ai; let s = `${i + 1}) ${x.title} — [${x.cat} · ${x.prio} · ${x.st}]\n${x.text || ''}${x.photo ? '\n(فيها صورة: ' + x.photo + ')' : ''}`;
    if (a) s += `\n🤖 رأي الذكاء الاصطناعي: ${a.summary}\n${(a.ways || []).map(w => '  - ' + w.title + ': ' + w.how).join('\n')}\n  ⭐ الأحسن: ${a.best}\n  📍 فين: ${a.where}${(a.steps || []).length ? '\n  👣 ' + a.steps.join(' ← ') : ''}`;
    (x.thread || []).forEach(t => { s += `\n  ❓ ${t.q}\n  ↳ ${t.a}`; });
    return s; }).join('\n\n') + '\n\nاقرا الأفكار دي واقترح إزاي ننفذها في MEC-APP أو بره التطبيق، واستنى موافقتي قبل أي تنفيذ.';
  try { await navigator.clipboard.writeText(txt); toast('اتنسخ ✓ الزقه في محادثة Claude'); }
  catch (e) { openSheet(`<h3>📋 انسخ النص ده</h3><textarea class="in" style="min-height:300px" readonly>${esc(txt)}</textarea><p class="muted" style="font-size:12.5px">دوس دوسة طويلة ← تحديد الكل ← نسخ، وبعدين الزقه في محادثة Claude.</p>`); }
}

/* ================= البداية ================= */
(function boot(){
  const code = new URLSearchParams(location.search).get('invite');
  if (code) {
    S.invite = code; store.set('pendingInvite', code);
    /* لو موبايل عليه حساب تاني، الدعوة الجديدة بتطلعه منه */
    if (S.session) { S.session = ''; S.user = null; ['session','user','pinHash','lockFails','projects','team'].forEach(store.del); S.projects = []; }
    history.replaceState(null, '', location.pathname);
  }
})();
addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });
addEventListener('appinstalled', () => { toast('اتثبت ✓'); });
document.body.classList.toggle('sun', store.get('sun', false));
if ('serviceWorker' in navigator) {
  /* نسخة جديدة اتنزلت: شريط «حدّث» */
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadCtl || $('#updBar')) return;
    document.body.insertAdjacentHTML('beforeend', `<div class="upd" id="updBar">${ic('sparkle')}<span style="flex:1">نزلت نسخة جديدة من التطبيق</span><button class="pill p-info" id="updGo">حدّث دلوقتي</button></div>`);
    $('#updGo').onclick = () => location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => { document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); }); }).catch(() => {});
}
render();
