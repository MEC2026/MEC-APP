<style>
:root{
  --navy:#1D2E4F; --navy2:#2A4170; --gold:#E8AA2E; --gold-soft:#FBF1DC;
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#1B2333; --muted:#6B7280; --line:#E3E6EB;
  --ok:#1E8E5A; --ok-bg:#E6F4EC; --warn:#B7791F; --warn-bg:#FDF3DC; --bad:#C0392B; --bad-bg:#FBE9E7;
  --r:14px; --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;overflow-x:hidden}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:12px;opacity:.75}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;flex:none}
.ibtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative}
.ibtn:active{background:rgba(255,255,255,.12)}
.dot{position:absolute;top:4px;left:4px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.demo{background:var(--gold-soft);color:#7a5a00;font-size:12.5px;text-align:center;padding:6px 16px;border-bottom:1px solid #F3DFA6}

/* layout */
main{padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
h2.sec{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .more{margin-inline-start:auto;font-size:13px;font-weight:600;color:var(--navy2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.stack>*+*{margin-top:10px}

/* latest cards strip */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.kc{flex:0 0 78%;max-width:280px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start}
.kc .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kc .val{font-size:20px;font-weight:700;margin:4px 0 2px;direction:ltr;text-align:right}
.kc .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money.masked .mv{filter:blur(7px);user-select:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:#EAF0FA;color:var(--navy2)}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:start}
.li+.li{margin-top:8px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:12.5px}
.ico{width:38px;height:38px;border-radius:10px;background:#EEF2F8;color:var(--navy);display:grid;place-items:center;flex:none}

/* project card */
.pc{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pc+.pc{margin-top:10px}
.pc .head{display:flex;align-items:flex-start;gap:8px}
.pc .head b{flex:1;font-size:15.5px;font-weight:700;line-height:1.4}
.pc .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:#EDF0F4;border-radius:6px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--navy2);border-radius:6px}
.pc .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* grid of sections */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;position:relative;min-height:92px}
.tile .soon{position:absolute;top:6px;left:6px;font-size:10px;font-weight:600;color:var(--muted);background:#F1F3F6;border-radius:6px;padding:0 5px}
.tile.live{border-color:var(--navy2)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* bottom nav */
nav.bn{position:fixed;bottom:0;inset-inline:0;z-index:30;background:#fff;border-top:1px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav.bn button.on{color:var(--navy);font-weight:700}
nav.bn .fab{width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--navy);margin:-22px auto 0;box-shadow:0 4px 12px rgba(29,46,79,.25);display:grid;place-items:center}
nav.bn .fab svg{width:26px;height:26px;stroke-width:2}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,22,38,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;background:#fff;border-radius:20px 20px 0 0;max-height:85vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#D5D9E0;margin:6px auto 12px}
.sheet h3{margin:0 0 12px;font-size:16px}
.mi{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #F0F2F5;width:100%;text-align:start;font-weight:600}
.mi:last-child{border-bottom:0}
.mi .soon{margin-inline-start:auto;font-size:11px;color:var(--muted);background:#F1F3F6;border-radius:6px;padding:1px 7px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa button{background:#F5F7FA;border:1px solid var(--line);border-radius:var(--r);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:15px}
.in:focus{outline:2px solid #C9D6EE;border-color:var(--navy2)}
textarea.in{min-height:88px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:12px;font-weight:700}
.btn.pri{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{border:1px solid var(--line);background:#fff}
.saved{font-size:12px;color:var(--ok);min-height:16px;margin-top:4px}
.sheetX{position:sticky;top:0;float:left;width:36px;height:36px;border-radius:50%;background:#F1F3F6;display:grid;place-items:center;z-index:2;margin-top:-6px}

/* screens: login & install */
.full{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(24px + env(safe-area-inset-bottom));background:#fff;color:var(--ink)}
.full .box{max-width:400px;width:100%;margin:0 auto}
.logo{width:150px;height:150px;margin:0 auto 6px;display:block}
.brand{text-align:center;margin-bottom:18px}
.brand b{display:block;font-size:22px}
.brand small{opacity:.8}
.users{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.users button{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.users button.on{border-color:var(--navy);background:#EEF2F8}
.users button b{display:block;font-size:14px}
.users button small{color:var(--muted);font-size:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.steps{margin:10px 0 0;padding-inline-start:20px;color:var(--muted);font-size:13.5px}

.toast{position:fixed;top:calc(66px + env(safe-area-inset-top));inset-inline:16px;z-index:60;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;text-align:center;opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty svg{width:40px;height:40px;stroke-width:1.2;color:#AAB2C0}
.news{background:linear-gradient(0deg,#fff,#fff);border:1px solid #F3DFA6;background:var(--gold-soft)}
</style>
</head>

const store = {
  get(k, d){ try{ const v = localStorage.getItem(LS+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(LS+k); }catch(e){} }
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (id, cls='') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const money = n => `<span class="mv">${Number(n).toLocaleString('en-US')}</span> ج`;

const device = () => (navigator.userAgent.match(/\(([^)]+)\)/) || ['', 'جهاز'])[1].slice(0, 60);
const execUrl = () => store.get('exec', DEFAULT_EXEC);
const errMsg = r => ERR[(r && r.error) || 'server'] + (r && r.left ? ` (فاضل ${r.left} محاولات)` : '');
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function soon(name){ toast(`«${name}» جاي في مرحلة جاية`); }
const digits = s => String(s || '').replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 1632));
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }

/* ================= الكلام مع جوجل ================= */
async function api(action, data = {}){
  const body = Object.assign({action, device: device()}, data);
  if (S.session && !body.session) body.session = S.session;
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(execUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), signal: ctl.signal});
    return await r.json();
  } catch (e) { return {ok:false, error:'net'}; }
  finally { clearTimeout(t); }
}

/* سجل النشاط: بيتحفظ على الموبايل ويتبعت لجوجل أول ما النت يبقى متاح */
function logAct(action, project){
  if (!S.user) return;
  const q = store.get('logq', []);
  q.push({action, project: project || '', at: new Date().toISOString()});
  store.set('logq', q.slice(-300));
  flushLog();
}
let flushing = false;
async function flushLog(){
  if (flushing || !S.session || !navigator.onLine) return;
  const q = store.get('logq', []); if (!q.length) return;
  flushing = true;
  const batch = q.slice(0, 50);
  const r = await api('log', {items: batch});
  if (r.ok) store.set('logq', store.get('logq', []).slice(batch.length));
  flushing = false;
  if (r.ok && store.get('logq', []).length) flushLog();
}
addEventListener('online', flushLog);

/* ================= الحفظ التلقائي =================
   أي عنصر فيه data-ak بيتحفظ مع كل حرف، ويرجع زي ما هو حتى لو التطبيق اتقفل */
function bindAutosave(root){
  root.querySelectorAll('[data-ak]').forEach(el => {
    const key = 'ak.' + el.dataset.ak;
    const v = store.get(key, null);
    if (v !== null) el.value = v;
    el.addEventListener('input', () => {
      store.set(key, el.value);
      const s = root.querySelector(`[data-saved="${el.dataset.ak}"]`);
      if (s) s.textContent = 'اتحفظ على الموبايل ✓';
    });
  });
}

/* ================= الدخول ================= */
async function signedIn(r, pin){
  S.session = r.session; S.user = r.user; S.unlocked = true;
  store.set('session', r.session); store.set('user', r.user); store.set('lastPhone', r.user.phone);
  store.set('pinHash', await sha(r.user.id + ':' + pin)); store.set('lockFails', 0);
  store.del('pendingInvite'); S.invite = '';
  render(); flushLog();
}
function signOut(msg){
  S.session = ''; S.user = null; S.unlocked = false; S.project = null; S.tab = 'home';
  ['session','user','pinHash','lockFails'].forEach(store.del);
  render(); if (msg) toast(msg);
}
async function refreshMe(){
  if (!S.session || !navigator.onLine) return;
  const r = await api('me');
  if (r.ok) { S.user = r.user; store.set('user', r.user); }
  else if (['session','disabled','locked'].includes(r.error)) signOut(errMsg(r));
}

function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }

function render(){
  const app = $('#app');
  if (S.invite) { app.innerHTML = inviteView(); wireInvite(); return; }
  if (!S.session || !S.user) { app.innerHTML = loginView(); wireLogin(); return; }
  if (!S.unlocked) { app.innerHTML = lockView(); wireLock(); return; }
  if (!isStandalone() && !store.get('skipInstall', false)) { app.innerHTML = installView(); wireInstall(); return; }
  app.innerHTML = shell();
  wireShell();
}

    const f = store.get('lockFails', 0) + 1; store.set('lockFails', f);

  return `<div class="card" style="padding:10px 12px;margin-bottom:12px"><div class="row">${ic('search')}<input class="in" style="border:0;padding:4px" id="pSearch" placeholder="دوّر باسم المشروع أو الكود أو العميل"></div></div>
  <div id="pList">${myProjects().map(projectCard).join('')}</div>`;
}

function projectView(){
  const p = DEMO_PROJECTS.find(x => x.code === S.project);
  return `
  <button class="row muted" id="back" style="margin-bottom:10px">${ic('arrowR')} المشاريع</button>
  ${projectCard(p).replace('<button class="pc" data-open', '<div class="pc" data-x').replace(/<\/button>$/, '</div>')}
  <h2 class="sec">آخر حاجة في المشروع</h2>
  ${latestStrip([
    {i:'doc', lbl:'آخر مستخلص', money:p.extract.value, sub:`جاري ${p.extract.no} · ${p.extract.status}`},
    {i:'cash', lbl:'آخر مصروف', money:2350, sub:'نقل مخلفات · امبارح'},
    {i:'camera', lbl:'آخر يومية', val:'النهارده', sub:'6 عمال · 4 صور · معوق واحد'}
  ])}
  <h2 class="sec">أقسام المشروع</h2>
  <div class="grid">${SECTIONS.map(s => `<button class="tile ${s.live?'live':''}" data-sec="${s.k}" data-n="${esc(s.n)}">${s.live?'':'<span class="soon">قريبًا</span>'}<span class="ico">${ic(s.i)}</span>${esc(s.n)}</button>`).join('')}</div>
  <h2 class="sec">ملاحظات المشروع</h2>
  <div class="card"><textarea class="in" data-ak="pnote.${p.code}" placeholder="ملاحظات سريعة على المشروع… بتتحفظ لوحدها"></textarea><div class="saved" data-saved="pnote.${p.code}"></div></div>`;
}

function taskItem(t){
  const pill = t.state === 'late' ? '<span class="pill p-bad">متأخرة</span>' : t.state === 'done' ? '<span class="pill p-ok">اتقفلت</span>' : `<span class="pill p-info">${esc(t.due)}</span>`;
  return `<button class="li" data-soon="المهام"><span class="ico">${ic('check')}</span><span class="t"><b>${esc(t.t)}</b><small>${esc(t.p)} · من ${esc(t.by)}</small></span>${pill}</button>`;
}
function tasksView(){
  const tabs = [['mine','مهامي'],['given','اللي أسندتها'],['late','المتأخرة'],['done','المكتملة']];
  const list = DEMO_TASKS.filter(t => S.taskTab === 'given' ? isBoss() && t.state !== 'done' : t.state === S.taskTab);
  return `<div class="tabs">${tabs.map(([k,n]) => `<button class="tab ${S.taskTab===k?'on':''}" data-tt="${k}">${n}</button>`).join('')}</div>
    ${list.map(taskItem).join('') || emptyBox('check','مفيش مهام هنا')}`;
}

function moreView(){
  return `<div class="card" style="padding:4px 14px">
    ${isBoss() ? `<button class="mi" id="team">${ic('shield')}الفريق والصلاحيات</button>` : ''}
    ${MORE.map(m => `<button class="mi" data-soon="${esc(m.n)}">${ic(m.i)}${esc(m.n)}<span class="soon">قريبًا</span></button>`).join('')}
  </div>
  <h2 class="sec">النظام</h2>
  <div class="card" style="padding:4px 14px">
    ${isBoss() ? `<button class="mi" id="actLog">${ic('clock')}سجل النشاط</button>` : ''}
    ${isOwner() ? `<button class="mi" data-soon="النسخ الاحتياطي">${ic('cloud')}النسخ الاحتياطي<span class="soon">قريبًا</span></button>` : ''}
    <button class="mi" id="settings">${ic('gear')}الإعدادات والاتصال</button>
    <button class="mi" id="report">${ic('alert')}الإبلاغ عن مشكلة</button>
    <button class="mi" id="install">${ic('download')}حمّل تطبيق MEC</button>
    <button class="mi" id="logout" style="color:var(--bad)">${ic('logout')}تسجيل الخروج</button>
  </div>
  <p class="muted" style="text-align:center;font-size:12.5px;margin-top:16px">MEC-APP · نسخة ${APP_VERSION}</p>`;
}

/* ================= الشيتات اللي بتطلع من تحت ================= */
function openSheet(html){
  $('#sheetBody').innerHTML = `<button class="sheetX" id="sheetX" aria-label="قفل"><svg class="i"><path d="M6 6l12 12M18 6 6 18"/></svg></button>` + html;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); bindAutosave($('#sheetBody'));
  $('#sheetX').onclick = closeSheet;
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;

function fabSheet(){
  const acts = [['ruler','أوضة في الحصر','takeoff'],['cash','مصروف','exp'],['camera','يومية','daily'],['check','مهمة','task'],['wallet','تحصيل','pay'],['box','استلام خامة','mat']];
  openSheet(`<h3>تضيف إيه؟</h3><div class="qa">${acts.map(([i,n,k]) => `<button data-qa="${k}" data-n="${n}">${ic(i)}${n}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-qa]').forEach(b => b.onclick = () => { closeSheet(); if (b.dataset.qa === 'takeoff') openTakeoff(); else soon(b.dataset.n); });
}

/* ---------- الفريق والصلاحيات ---------- */
const inviteLink = code => location.origin + location.pathname + '?invite=' + code;
const waPhone = p => { const d = digits(p).replace(/\D/g, ''); return d.startsWith('0') ? '2' + d : d; };
function shareInvite(name, phone, code){
  const link = inviteLink(code);
  const msg = `أهلا ${name}، ده لينك تفعيل حسابك على تطبيق MEC-APP بتاع شركة الشرق الأوسط للإنشاءات:\n${link}\nافتحه من كروم على موبايلك، واعمل رقمك السري. اللينك بيشتغل مرة واحدة وخلال 7 أيام.`;
  openSheet(`<h3>لينك الدعوة لـ ${esc(name)}</h3>
    <div class="card" style="direction:ltr;text-align:left;word-break:break-all;font-size:13px">${esc(link)}</div>
    <p class="muted" style="font-size:12.5px">ابعته له هو بس. اللينك بيشتغل مرة واحدة وخلال 7 أيام.</p>
    <a class="btn gold" href="https://wa.me/${waPhone(phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" style="text-decoration:none">ابعته على واتساب</a>
    <button class="btn ghost" id="cpLink" style="margin-top:8px">نسخ اللينك</button>`);
  $('#cpLink').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('اتنسخ ✓'); } catch (e) { toast('انسخه بإيدك من فوق'); } };
}
async function teamSheet(){
  openSheet(`<h3>الفريق والصلاحيات</h3><div id="tList" class="muted">بيحمّل…</div>
    ${canManage() ? `<button class="btn pri" id="tAdd" style="margin-top:12px">${ic('plus')} ضيف شخص</button>` : ''}`);
  if (canManage()) $('#tAdd').onclick = addUserSheet;
  const r = await api('users');
  if (!$('#tList')) return;
  if (!r.ok) { $('#tList').innerHTML = `<span style="color:var(--bad)">${esc(errMsg(r))}</span>`; return; }
  const st = u => u.status === 'disabled' ? '<span class="pill p-bad">متوقف</span>' : u.status === 'locked' ? '<span class="pill p-bad">مقفول</span>' : u.status === 'invited' ? '<span class="pill p-warn">لسه ما فعّلش</span>' : '<span class="pill p-ok">شغال</span>';
  $('#tList').innerHTML = r.items.map(u => `<div class="li" style="flex-wrap:wrap">
      <span class="ico">${ic('users')}</span>
      <span class="t"><b>${esc(u.name)}</b><small>${(ROLES[u.role]||{}).name || u.role} · <span dir="ltr">${esc(u.phone)}</span>${u.last ? ' · آخر دخول ' + new Date(u.last).toLocaleDateString('ar-EG') : ''}</small></span>${st(u)}
      ${canManage() && u.role !== 'owner' && u.id !== S.user.id ? `<div class="row" style="width:100%;gap:6px;margin-top:8px">
        <button class="btn ghost" style="padding:8px;font-size:13px" data-re="${esc(u.id)}" data-nm="${esc(u.name)}" data-ph="${esc(u.phone)}">لينك جديد</button>
        <button class="btn ghost" style="padding:8px;font-size:13px;color:${u.status==='disabled'||u.status==='locked'?'var(--ok)':'var(--bad)'}" data-st="${esc(u.id)}" data-to="${u.status==='disabled'||u.status==='locked'?'active':'disabled'}">${u.status==='disabled'||u.status==='locked'?'فتح الحساب':'إيقاف الحساب'}</button>
      </div>` : ''}
    </div>`).join('') || emptyBox('users','مفيش حد لسه');
  document.querySelectorAll('[data-re]').forEach(b => b.onclick = async () => {
    if (!confirmBox(`لينك جديد لـ ${b.dataset.nm}؟ الرقم السري القديم بتاعه هيتلغي ويعمل واحد جديد.`)) return;
    const x = await api('reinvite', {id: b.dataset.re});
    if (x.ok) shareInvite(b.dataset.nm, b.dataset.ph, x.code); else toast(errMsg(x));
  });
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    const x = await api('setStatus', {id: b.dataset.st, status: b.dataset.to});
    if (x.ok) { toast(b.dataset.to === 'disabled' ? 'الحساب اتوقف ✓' : 'الحساب اتفتح ✓'); teamSheet(); } else toast(errMsg(x));
  });
}
function confirmBox(msg){ return window.confirm(msg); }
function addUserSheet(){
  openSheet(`<h3>ضيف شخص للفريق</h3>
    <label class="f">الاسم زي ما هيظهر</label><input class="in" id="aName" data-ak="add.name">
    <label class="f">رقم الموبايل</label><input class="in" id="aPhone" type="tel" dir="ltr" placeholder="01xxxxxxxxx" data-ak="add.phone">
    <label class="f">الدور</label>
    <select class="in" id="aRole" data-ak="add.role">
      <option value="engineer">مهندس: مشاريعه، ويقدر يعمل شغل المشرف</option>
      <option value="supervisor">مشرف: الحضور والخامات والحصر ومهامه في مشروعه</option>
      <option value="manager">مدير: نفس صلاحيات المالك</option>
      <option value="contractor">مقاول: مهامه وصور شغله وحسابه</option>
    </select>
    <label class="f">المشاريع (اختياري)</label><input class="in" id="aProj" placeholder="أكواد المشاريع، أو سيبها لحد ما المشاريع تتسجل" data-ak="add.proj">
    <div class="err" id="aErr"></div>
    <button class="btn gold" id="aGo">ضيفه واعمل لينك الدعوة</button>`);
  $('#aGo').onclick = async () => {
    busy($('#aGo'), true);
    const r = await api('addUser', {name: $('#aName').value, phone: digits($('#aPhone').value), role: $('#aRole').value, projects: $('#aProj').value});
    busy($('#aGo'), false);
    if (!r.ok) { $('#aErr').textContent = errMsg(r); return; }
    ['name','phone','role','proj'].forEach(k => store.del('ak.add.' + k));
    shareInvite(r.user.name, r.user.phone, r.code);
  };
}

/* ---------- سجل النشاط ---------- */
async function logSheet(){
  openSheet(`<h3>سجل النشاط</h3><select class="in" id="logWho"><option value="">الكل</option></select><div id="logList" class="muted" style="margin-top:10px">بيحمّل…</div>`);
  const [u, l] = await Promise.all([api('users'), api('logs', {limit: 200})]);
  if (!$('#logList')) return;
  if (u.ok) $('#logWho').innerHTML = '<option value="">الكل</option>' + u.items.map(x => `<option>${esc(x.name)}</option>`).join('');
  const draw = items => items.map(x => { const d = new Date(x.at);
    return `<div class="mi" style="font-weight:400"><span class="ico">${ic('clock')}</span><span style="flex:1;min-width:0"><b style="display:block;font-weight:600">${esc(x.action)}${x.project ? ' · ' + esc(x.project) : ''}</b><small class="muted">${esc(x.user)} · ${d.toLocaleDateString('ar-EG')} ${d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</small></span></div>`; }).join('') || emptyBox('clock','مفيش نشاط');
  if (!l.ok) { $('#logList').innerHTML = `<span style="color:var(--bad)">${esc(errMsg(l))}</span>`; return; }
  $('#logList').innerHTML = draw(l.items);
  $('#logWho').onchange = async e => { $('#logList').textContent = 'بيحمّل…'; const r = await api('logs', {user: e.target.value, limit: 200}); $('#logList').innerHTML = r.ok ? draw(r.items) : esc(errMsg(r)); };
}

function settingsSheet(){
  openSheet(`<h3>الإعدادات والاتصال</h3>
    ${isOwner() ? `<label class="f">لينك جوجل (/exec)</label><input class="in" id="sExec" dir="ltr" value="${esc(execUrl())}">` : ''}
    <div class="err" id="sMsg" style="color:var(--muted)"></div>
    <div class="row" style="margin-top:6px"><button class="btn ghost" id="sTest">اختبار الاتصال</button>${isOwner() ? '<button class="btn pri" id="sSave">حفظ</button>' : ''}</div>`);
  if ($('#sSave')) $('#sSave').onclick = () => { store.set('exec', $('#sExec').value.trim()); logAct('غيّر لينك جوجل'); toast('اتحفظ ✓'); closeSheet(); };
  $('#sTest').onclick = async () => {
    const m = $('#sMsg'); m.style.color = 'var(--muted)'; m.textContent = 'بيختبر…';
    const r = await api('me');
    if (r.ok) { m.style.color = 'var(--ok)'; m.textContent = 'الاتصال بجوجل شغال ✓'; }
    else { m.style.color = 'var(--bad)'; m.textContent = errMsg(r); }
  };
}

function reportSheet(){
  const info = `نسخة ${APP_VERSION} · ${navigator.userAgent}`;
  openSheet(`<h3>الإبلاغ عن مشكلة</h3>
    <textarea class="in" data-ak="report" placeholder="حصل إيه؟ كنت بتعمل إيه وقتها؟"></textarea><div class="saved" data-saved="report"></div>
    <p class="muted" style="font-size:12px;direction:ltr;text-align:left;word-break:break-all">${esc(info)}</p>
    <button class="btn gold" id="rSend">ابعتها على واتساب</button>`);
  $('#rSend').onclick = () => {
    const txt = (store.get('ak.report','') || '') + '\n\n' + info;
    window.open('https://wa.me/?text=' + encodeURIComponent('مشكلة في MEC-APP:\n' + txt), '_blank');
    logAct('بعت بلاغ عن مشكلة');
  };
}

function openTakeoff(){ logAct('فتح الحصر', S.project || ''); window.open(execUrl(), '_blank'); }

/* ================= الربط ================= */
function wireShell(){
  const v = $('#view');
  bindAutosave(v);
  document.querySelectorAll('nav.bn [data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.project = null; render(); scrollTo(0,0); });
  $('#fab').onclick = fabSheet;
  $('#searchBtn').onclick = () => { S.tab = 'projects'; S.project = null; render(); setTimeout(() => { const s = $('#pSearch'); if (s) s.focus(); }, 50); };
  $('#bellBtn').onclick = () => openSheet(`<h3>الإشعارات</h3><p class="muted">الإشعارات الحقيقية هتشتغل مع المصروفات والمهام. دي أمثلة.</p>${isBoss()
      ? `<div class="li">${ic('cash')}<span class="t"><b>2 مصروف مستنيين موافقتك</b><small>تجربة</small></span></div><div class="li">${ic('clock')}<span class="t"><b>بند متأخر في MEC-101</b><small>تجربة</small></span></div>`
      : `<div class="li">${ic('check')}<span class="t"><b>مهمة جديدة: استلام محارة أوضة نوم 1</b><small>تجربة</small></span></div>`}`);
  const eye = $('#eyeBtn');
  if (eye) eye.onclick = () => { S.masked = !S.masked; store.set('masked', S.masked); render(); };
  v.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { S.project = b.dataset.open; logAct('فتح مشروع', S.project); render(); scrollTo(0,0); });
  v.querySelectorAll('[data-t2]').forEach(b => b.onclick = () => { S.tab = b.dataset.t2; render(); });
  v.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => soon(b.dataset.soon));
  v.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { if (b.dataset.sec === 'takeoff') openTakeoff(); else soon(b.dataset.n); });
  v.querySelectorAll('[data-tt]').forEach(b => b.onclick = () => { S.taskTab = b.dataset.tt; render(); });
  const back = $('#back'); if (back) back.onclick = () => { S.project = null; S.tab = 'projects'; render(); };
  const ok = $('#newsOk'); if (ok) ok.onclick = () => { store.set('seenVersion', APP_VERSION); render(); };
  const ps = $('#pSearch');
  if (ps) ps.oninput = () => {
    const q = ps.value.trim();
    const list = myProjects().filter(p => !q || (p.name + p.code + p.client).includes(q));
    $('#pList').innerHTML = list.map(projectCard).join('') || emptyBox('search','مفيش نتايج');
    $('#pList').querySelectorAll('[data-open]').forEach(b => b.onclick = () => { S.project = b.dataset.open; render(); });
  };
  const id = x => document.getElementById(x);
  if (id('team')) id('team').onclick = teamSheet;
  if (id('settings')) id('settings').onclick = settingsSheet;
  if (id('actLog')) id('actLog').onclick = logSheet;
  if (id('report')) id('report').onclick = reportSheet;
  if (id('install')) id('install').onclick = () => { if (isStandalone()) toast('التطبيق متثبت عندك بالفعل ✓'); else { store.set('skipInstall', false); render(); } };
  if (id('logout')) id('logout').onclick = () => { api('logout'); signOut(); };
}

/* ================= البداية ================= */
(function boot(){
  const code = new URLSearchParams(location.search).get('invite');
  if (code) {
    S.invite = code; store.set('pendingInvite', code);
    /* لو موبايل عليه حساب تاني، الدعوة الجديدة بتطلعه منه */
    if (S.session) { S.session = ''; S.user = null; ['session','user','pinHash','lockFails'].forEach(store.del); }
    history.replaceState(null, '', location.pathname);
  }
})();
addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });
addEventListener('appinstalled', () => { toast('اتثبت ✓'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
