<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2E4F">
<title>MEC-APP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" as="image" href="logo-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1D2E4F; --navy2:#2A4170; --gold:#E8AA2E; --gold-soft:#FBF1DC;
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#1B2333; --muted:#6B7280; --line:#E3E6EB;
  --ok:#1E8E5A; --ok-bg:#E6F4EC; --warn:#B7791F; --warn-bg:#FDF3DC; --bad:#C0392B; --bad-bg:#FBE9E7;
  --r:14px; --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;overflow-x:hidden}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:12px;opacity:.75}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;flex:none}
.ibtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative}
.ibtn:active{background:rgba(255,255,255,.12)}
.dot{position:absolute;top:4px;left:4px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.demo{background:var(--gold-soft);color:#7a5a00;font-size:12.5px;text-align:center;padding:6px 16px;border-bottom:1px solid #F3DFA6}

/* layout */
main{padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
h2.sec{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .more{margin-inline-start:auto;font-size:13px;font-weight:600;color:var(--navy2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.stack>*+*{margin-top:10px}

/* latest cards strip */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.kc{flex:0 0 78%;max-width:280px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start}
.kc .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kc .val{font-size:20px;font-weight:700;margin:4px 0 2px;direction:ltr;text-align:right}
.kc .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money.masked .mv{filter:blur(7px);user-select:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:#EAF0FA;color:var(--navy2)}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:start}
.li+.li{margin-top:8px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:12.5px}
.ico{width:38px;height:38px;border-radius:10px;background:#EEF2F8;color:var(--navy);display:grid;place-items:center;flex:none}

/* project card */
.pc{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pc+.pc{margin-top:10px}
.pc .head{display:flex;align-items:flex-start;gap:8px}
.pc .head b{flex:1;font-size:15.5px;font-weight:700;line-height:1.4}
.pc .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:#EDF0F4;border-radius:6px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--navy2);border-radius:6px}
.pc .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* grid of sections */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;position:relative;min-height:92px}
.tile .soon{position:absolute;top:6px;left:6px;font-size:10px;font-weight:600;color:var(--muted);background:#F1F3F6;border-radius:6px;padding:0 5px}
.tile.live{border-color:var(--navy2)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* bottom nav */
nav.bn{position:fixed;bottom:0;inset-inline:0;z-index:30;background:#fff;border-top:1px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav.bn button.on{color:var(--navy);font-weight:700}
nav.bn .fab{width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--navy);margin:-22px auto 0;box-shadow:0 4px 12px rgba(29,46,79,.25);display:grid;place-items:center}
nav.bn .fab svg{width:26px;height:26px;stroke-width:2}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,22,38,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;background:#fff;border-radius:20px 20px 0 0;max-height:85vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#D5D9E0;margin:6px auto 12px}
.sheet h3{margin:0 0 12px;font-size:16px}
.mi{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #F0F2F5;width:100%;text-align:start;font-weight:600}
.mi:last-child{border-bottom:0}
.mi .soon{margin-inline-start:auto;font-size:11px;color:var(--muted);background:#F1F3F6;border-radius:6px;padding:1px 7px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa button{background:#F5F7FA;border:1px solid var(--line);border-radius:var(--r);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:15px}
.in:focus{outline:2px solid #C9D6EE;border-color:var(--navy2)}
textarea.in{min-height:88px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:12px;font-weight:700}
.btn.pri{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{border:1px solid var(--line);background:#fff}
.saved{font-size:12px;color:var(--ok);min-height:16px;margin-top:4px}
.sheetX{position:sticky;top:0;float:left;width:36px;height:36px;border-radius:50%;background:#F1F3F6;display:grid;place-items:center;z-index:2;margin-top:-6px}

/* screens: login & install */
.full{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(24px + env(safe-area-inset-bottom));background:#fff;color:var(--ink)}
.full .box{max-width:400px;width:100%;margin:0 auto}
.logo{width:150px;height:150px;margin:0 auto 6px;display:block}
.brand{text-align:center;margin-bottom:18px}
.brand b{display:block;font-size:22px}
.brand small{opacity:.8}
.users{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.users button{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.users button.on{border-color:var(--navy);background:#EEF2F8}
.users button b{display:block;font-size:14px}
.users button small{color:var(--muted);font-size:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.steps{margin:10px 0 0;padding-inline-start:20px;color:var(--muted);font-size:13.5px}

.toast{position:fixed;top:calc(66px + env(safe-area-inset-top));inset-inline:16px;z-index:60;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;text-align:center;opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty svg{width:40px;height:40px;stroke-width:1.2;color:#AAB2C0}
.news{background:linear-gradient(0deg,#fff,#fff);border:1px solid #F3DFA6;background:var(--gold-soft)}
.bdg{position:absolute;top:3px;left:3px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bar{height:6px;border-radius:4px;background:#EEF0F4;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:4px}
.tl{margin-top:10px;font-size:12.5px;color:var(--muted)}
.nt{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid #F0F2F5}.nt:last-child{border-bottom:0}.nt.un b{color:var(--ink)}.nt .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;margin-top:7px}.nt.rd .dot{background:transparent}
.grp{font-size:12.5px;font-weight:700;color:var(--navy2);margin:14px 2px 4px}
</style>
</head>

async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }

/* ================= الكلام مع جوجل ================= */
async function api(action, data = {}){
  const body = Object.assign({action, device: device()}, data);
  if (S.session && !body.session) body.session = S.session;
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(execUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), signal: ctl.signal});
    return await r.json();
  } catch (e) { return {ok:false, error:'net'}; }
  finally { clearTimeout(t); }
}

/* سجل النشاط: بيتحفظ على الموبايل ويتبعت لجوجل أول ما النت يبقى متاح */
function logAct(action, project){
  if (!S.user) return;
  const q = store.get('logq', []);
  q.push({action, project: project || '', at: new Date().toISOString()});
  store.set('logq', q.slice(-300));
  flushLog();
}
let flushing = false;
async function flushLog(){
  if (flushing || !S.session || !navigator.onLine) return;
  const q = store.get('logq', []); if (!q.length) return;
  flushing = true;
  const batch = q.slice(0, 50);
  const r = await api('log', {items: batch});
  if (r.ok) store.set('logq', store.get('logq', []).slice(batch.length));
  flushing = false;
  if (r.ok && store.get('logq', []).length) flushLog();
}
addEventListener('online', flushLog);

/* ================= الحفظ التلقائي =================
   أي عنصر فيه data-ak بيتحفظ مع كل حرف، ويرجع زي ما هو حتى لو التطبيق اتقفل */
function bindAutosave(root){
  root.querySelectorAll('[data-ak]').forEach(el => {
    const key = 'ak.' + el.dataset.ak;
    const v = store.get(key, null);
    if (v !== null) el.value = v;
    el.addEventListener('input', () => {
      store.set(key, el.value);
      const s = root.querySelector(`[data-saved="${el.dataset.ak}"]`);
      if (s) s.textContent = 'اتحفظ على الموبايل ✓';
    });
  });
}

/* شريط الوقت: فات كام يوم من مدة المشروع (أخضر، أصفر من 80%، أحمر لو عدّى النهاية وهو لسه شغال) */
const dayMs = 864e5, today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const pDay = d => new Date(d + 'T00:00:00').getTime();
function timeBar(p){
  if (!p.start || !p.end) return '';
  const s = pDay(p.start), e = pDay(p.end), t = today0(), total = Math.max(1, Math.round((e - s) / dayMs));
  if (t < s) return `<div class="tl">يبدأ بعد ${Math.round((s - t) / dayMs)} يوم · المدة ${total} يوم</div>`;
  const gone = Math.round((t - s) / dayMs), pct = Math.min(100, Math.round(gone / total * 100));
  const late = t > e && p.status === 'جاري', col = late ? 'var(--bad)' : pct >= 80 ? 'var(--warn)' : 'var(--ok)';
  const txt = late ? `<b style="color:var(--bad)">متأخر ${Math.round((t - e) / dayMs)} يوم عن النهاية</b> · المدة ${total} يوم`
    : p.status === 'انتهى' ? `المدة ${total} يوم` : `فات ${gone} يوم من ${total} · <b>${pct}%</b> من الوقت`;
  return `<div class="tl">${txt}<div class="bar"><i style="width:${late ? 100 : pct}%;background:${col}"></i></div></div>`;
}
const pct = (a, b) => (a !== '' && b) ? Math.round(a / b * 100) : null;

const emptyBox = (i, t) => `<div class="empty">${ic(i)}<div>${esc(t)}</div></div>`;

function projectCard(p, asDiv){
  const tag = asDiv ? 'div' : 'button';
  const meta = [p.code, p.short && p.short !== p.name ? p.short : '', p.client, p.type, p.engName ? 'المهندس: ' + p.engName : ''].filter(Boolean).map(esc).join(' · ');
  return `<${tag} class="pc" ${asDiv ? '' : `data-open="${esc(p.code)}"`}>
    <div class="head"><b>${esc(p.name)}</b><span class="pill ${STATUS_PILL[p.status] || 'p-info'}">${esc(p.status)}</span></div>
    <div class="meta">${meta}</div>
    <div class="facts" style="margin-top:10px">
      <span class="pill" style="background:#F1F3F6;color:var(--muted)">الإنجاز: لسه</span>

    <div id="fCalcBox"><label class="f">طريقة الحساب</label><select class="in" id="fCalc" data-ak="${k}calc">${['من غير إشراف','Cost Plus','نسبة على المشروع'].map(v => opt(v, p && p.calc ? p.calc : 'من غير إشراف')).join('')}<option disabled>باكدجات (قريبًا)</option></select>

    <label class="f">قيمة العقد (ج)</label><input class="in" id="fValue" inputmode="decimal" dir="ltr" data-ak="${k}value">
    <label class="f">الدفعة المقدمة (ج)</label><input class="in" id="fAdv" inputmode="decimal" dir="ltr" data-ak="${k}adv">
    <label class="f">نسبة المحتجز %</label><input class="in" id="fRet" inputmode="decimal" dir="ltr" data-ak="${k}ret" placeholder="سيبها فاضية لو مفيش">
    <label class="f">تاريخ البداية</label><input class="in" id="fStart" type="date" data-ak="${k}start">

  if (p) [['fName','name'],['fClient','client'],['fCPhone','clientPhone'],['fAddr','address'],['fStart','start'],['fNotes','notes'],['fShort','short'],['fPct','supPct'],['fValue','value'],['fAdv','advance'],['fRet','retention'],['fEnd','end']].forEach(([id, f]) => {

  $('#fEng').innerHTML = people(['engineer','manager','owner'], draftEng !== null ? draftEng : (p ? p.engId : ''));
  $('#fSup').innerHTML = people(['supervisor','engineer'], draftSup !== null ? draftSup : (p ? p.supId : ''));
  $('#fSave').onclick = async () => {
    const data = {code: p ? p.code : '', name: $('#fName').value, type: $('#fType').value, client: $('#fClient').value,
      clientPhone: digits($('#fCPhone').value), address: $('#fAddr').value, engId: $('#fEng').value, supId: $('#fSup').value,
      start: $('#fStart').value, status: $('#fStatus').value, notes: $('#fNotes').value,
      short: $('#fShort').value, calc: $('#fCalc').value, supPct: digits($('#fPct').value), value: digits($('#fValue').value),
      advance: digits($('#fAdv').value), retention: digits($('#fRet').value), end: $('#fEnd').value};
    if (!data.name.trim()) { $('#fErr').textContent = 'اكتب اسم المشروع'; return; }
    busy($('#fSave'), true);
    const r = await api('saveProject', {project: data});
    busy($('#fSave'), false);
    if (!r.ok) { $('#fErr').textContent = errMsg(r); return; }
    ['name','type','client','cphone','addr','eng','sup','start','status','notes','short','calc','pct','value','adv','ret','end'].forEach(f => store.del('ak.' + k + f));
    const i = S.projects.findIndex(x => x.code === r.project.code);
    if (i >= 0) S.projects.splice(i, 1);
    S.projects.unshift(r.project); store.set('projects', S.projects);
    closeSheet(); S.project = r.project.code; render(); scrollTo(0, 0);
    toast(p ? 'اتحفظ التعديل ✓' : `اتعمل المشروع ${r.project.code} ✓`);
  };
}

/* الصورة بتتصغّر على الموبايل قبل ما تتبعت عشان النت */
function shrinkImage(file, max = 1280){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); res(''); };
    img.src = url;
  });
}

    <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">
      ${canEditP() ? `<button class="btn ghost" style="flex:1" id="pvEdit">تعديل</button>` : ''}
      ${isBoss() && p.status === 'مستني تأكيد' ? `<button class="btn gold" style="flex:1" id="pvOk">اعتماد</button>` : ''}
      ${isBoss() ? `<button class="btn ghost" style="flex:1" id="pvMerge">دمج مع…</button>` : ''}
      ${t === 'L' && canMoney() ? `<button class="btn ghost" style="flex:1" id="pvWage">تاريخ اليومية</button>` : ''}
      ${t === 'C' && canPay() ? `<label class="btn ghost" style="flex:1;text-align:center">${ic('camera')} مرفق<input type="file" id="pvFile" accept="image/*" hidden></label>` : ''}
    </div><div id="pvMore"></div>`);
  if ($('#pvEdit')) $('#pvEdit').onclick = () => personForm(t, p);
  if ($('#pvOk')) $('#pvOk').onclick = async () => { const r = await api('approvePerson', {type: t, code: p.code}); if (r.ok) { toast('اتعتمد ✓'); peopleSheet(t); } else toast(errMsg(r)); };
  if ($('#pvWage')) $('#pvWage').onclick = async () => { const r = await api('wageHistory', {type: t, code: p.code});
    $('#pvMore').innerHTML = r.ok ? `<h4 style="margin:14px 0 6px">تاريخ اليومية</h4><div class="card money ${S.masked ? 'masked' : ''}" style="padding:2px 14px">${r.items.map(w => `<div class="mi" style="font-weight:400"><span style="flex:1">من ${esc(fmtDate(w.from))}</span>${w.wage !== '' ? money(w.wage) : ''}${w.hour !== '' ? ` <small class="muted">· الساعة ${esc(w.hour)}</small>` : ''}</div>`).join('') || '<div class="mi muted">لسه</div>'}</div>` : esc(errMsg(r)); };
  if ($('#pvMerge')) $('#pvMerge').onclick = () => {
    const others = (S.people[t] || []).filter(x => x.code !== p.code);
    $('#pvMore').innerHTML = `<h4 style="margin:14px 0 4px">دمج ${esc(p.name)} في:</h4><p class="muted" style="font-size:12.5px;margin:0 0 6px">${esc(p.code)} هيختفي من القايمة، والناقص في التاني يتكمّل من بياناته.</p>
      <select class="in" id="mgTo">${others.map(x => `<option value="${esc(x.code)}">${esc(x.code)} · ${esc(x.name)}</option>`).join('')}</select><button class="btn gold" id="mgGo" style="margin-top:8px">دمج</button>`;
    $('#mgGo').onclick = async () => { if (!confirmBox(`تدمج ${p.name} في ${$('#mgTo').selectedOptions[0].textContent}؟`)) return;
      const r = await api('mergePerson', {type: t, from: p.code, into: $('#mgTo').value}); if (r.ok) { toast('اتدمج ✓'); peopleSheet(t); } else toast(errMsg(r)); };
  };
  if ($('#pvFile')) $('#pvFile').onchange = async e => { const f = e.target.files[0]; if (!f) return;
    const label = window.prompt('اسم المرفق (مثلا: صورة العقد، صورة البطاقة)', 'صورة العقد'); if (label === null) return;
    toast('بيرفع…'); const r = await api('personFile', {type: t, code: p.code, label, photo: await shrinkImage(f, 1600)});
    if (r.ok) { toast('اترفع ✓'); p.files = r.files; personView(t, p); } else toast(errMsg(r)); };
}
function personForm(t, p, force){
  const P = PPL[t], v = k => esc(p && p[k] != null ? p[k] : '');
  const opt = (val, cur) => `<option ${val === cur ? 'selected' : ''}>${esc(val)}</option>`;
  openSheet(`<h3>${p ? 'تعديل ' + esc(p.name) : P.one + ' جديد'}</h3>
    ${p ? `<p class="muted" style="margin:-6px 0 6px" dir="ltr">${esc(p.code)}</p>` : `<p class="muted" style="margin:-6px 0 6px;font-size:12.5px">الكود بيطلع لوحده${isBoss() ? '' : '، وهيفضل «مستني تأكيد» لحد ما المالك أو المدير يعتمد'}</p>`}
    <label class="f">الاسم *</label><input class="in" id="xName" value="${v('name')}">
    ${t === 'C' ? `<label class="f">فرد ولا شركة</label><select class="in" id="xKind">${opt('فرد', p ? p.kind : 'فرد')}${opt('شركة', p ? p.kind : '')}</select>` : ''}
    ${t !== 'S' ? `<label class="f">الصنعة</label><input class="in" id="xTrade" value="${v('trade')}" placeholder="${t === 'L' ? 'مبيض، نجار، مساعد…' : 'محارة، ألوميتال، كهرباء…'}">` : `<label class="f">نوع الخامات</label><input class="in" id="xGoods" value="${v('goods')}" placeholder="سيراميك، دهانات، أسمنت…">`}
    <label class="f">${t === 'L' ? 'التليفون' : 'التليفونات (افصل بينهم بفاصلة)'}</label><input class="in" id="xPhones" type="tel" dir="ltr" value="${v('phones')}" placeholder="01xxxxxxxxx">
    ${t === 'L' ? `<label class="f">المشروع اللي شغال فيه</label><select class="in" id="xProj"><option value="">من غير</option>${S.projects.map(x => `<option value="${esc(x.short || x.name)}" ${p && p.project === (x.short || x.name) ? 'selected' : ''}>${esc(x.short || x.name)}</option>`).join('')}</select>` : ''}
    ${t === 'L' && canMoney() ? `<h4 style="margin:16px 0 0;font-size:14px">اليومية <small class="muted" style="font-weight:400">· المالك والمدير والمحاسب بس</small></h4>
      <div class="row" style="gap:8px"><div style="flex:1"><label class="f">اليومية (ج)</label><input class="in" id="xWage" inputmode="decimal" dir="ltr" value="${v('wage')}"></div>
      <div style="flex:1"><label class="f">سعر الساعة الزيادة</label><input class="in" id="xHour" inputmode="decimal" dir="ltr" value="${v('hour')}"></div></div>
      ${p ? `<label class="f">لو غيرت اليومية: تبدأ من</label><input class="in" id="xFrom" type="date" value="${new Date().toISOString().slice(0,10)}"><p class="muted" style="font-size:12px;margin:4px 0 0">الأيام اللي قبل التاريخ ده تفضل بالسعر القديم.</p>` : ''}
      <label class="f">رصيد قبل التطبيق (ج)</label><input class="in" id="xOpen" inputmode="decimal" dir="ltr" value="${v('opening')}" placeholder="المتأخرات اللي ليه من الشيت القديم">` : ''}
    ${canPay() ? `<h4 style="margin:16px 0 0;font-size:14px">بيانات الدفع</h4>
      <label class="f">لينك دفع إنستاباي (اختياري)</label><input class="in" id="xIpn" dir="ltr" value="${v('ipn')}" placeholder="https://ipn.eg/S/…">
      <div class="row" style="gap:8px"><div style="flex:1.4"><label class="f">رقم الدفع</label><input class="in" id="xPayNo" type="tel" dir="ltr" value="${v('payNo')}" placeholder="01xxxxxxxxx"></div>
      <div style="flex:1"><label class="f">نوعه</label><select class="in" id="xPayType"><option value="">اختار</option>${opt('إنستاباي', p ? p.payType : '')}${opt('محفظة', p ? p.payType : '')}</select></div></div>
      <label class="f">البنك</label><input class="in" id="xBank" value="${v('bank')}">
      <label class="f">رقم الحساب أو IBAN</label><input class="in" id="xIban" dir="ltr" value="${v('iban')}">` : ''}
    <label class="f">ملاحظات</label><textarea class="in" id="xNotes">${v('notes')}</textarea>
    <div class="err" id="xErr"></div><div id="xSim"></div>
    <button class="btn gold" id="xSave">${p ? 'حفظ' : 'ضيف'}</button>`);
  const val = id => { const e = document.getElementById(id); return e ? e.value : undefined; };
  const send = async force => {
    const person = {code: p ? p.code : '', name: val('xName'), kind: val('xKind'), trade: val('xTrade'), goods: val('xGoods'), phones: digits(val('xPhones') || ''),
      project: val('xProj'), wage: digits(val('xWage') || ''), hour: digits(val('xHour') || ''), opening: digits(val('xOpen') || ''), wageFrom: val('xFrom'),
      ipn: (val('xIpn') || '').trim(), payNo: digits(val('xPayNo') || ''), payType: val('xPayType'), bank: val('xBank'), iban: val('xIban'), notes: val('xNotes')};
    if (!person.name.trim()) { $('#xErr').textContent = 'اكتب الاسم'; return; }
    busy($('#xSave'), true); $('#xErr').textContent = '';
    const r = await api('savePerson', {type: t, person, force: !!force});
    busy($('#xSave'), false);
    if (r.error === 'similar') {
      $('#xSim').innerHTML = `<div class="card" style="margin:8px 0;border-color:var(--warn)"><b>فيه اسم قريب، هو ده؟</b>
        ${r.matches.map(m => `<button class="mi" data-same="${esc(m.code)}" style="font-weight:400"><span class="pill p-info" dir="ltr">${esc(m.code)}</span><span style="flex:1">${esc(m.name)}<small class="muted" style="display:block">${esc(m.phones || '')}</small></span><small style="color:var(--navy2)">هو ده</small></button>`).join('')}
        <button class="btn ghost" id="xForce" style="margin-top:6px">لأ، ده شخص تاني. ${p ? 'احفظ' : 'ضيفه'}</button></div>`;
      document.querySelectorAll('[data-same]').forEach(b => b.onclick = async () => { const l = await loadPeople(t, true); personView(t, (l || []).find(x => x.code === b.dataset.same)); });
      $('#xForce').onclick = () => send(true);
      $('#xSim').scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    if (!r.ok) { $('#xErr').textContent = errMsg(r); return; }
    S.people[t] = null; toast(p ? 'اتحفظ ✓' : `اتضاف ${r.person.code} ✓`); personView(t, r.person);
  };
  $('#xSave').onclick = () => send(force);
}

/* ---------- بنود الشركة ---------- */
const normAr = s => String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
async function itemsSheet(){
  openSheet(`<h3>بنود الشركة</h3>
    <p class="muted" style="font-size:12.5px;margin:-4px 0 8px">كود موحد لمقايسات التشطيب بتاعتنا. مقايسات الشركات اللي بره بنودها بتتاخد من مقايسة العقد زي ما هي.</p>
    <input class="in" id="itQ" placeholder="دوّر باسم البند أو الكود">
    ${canManage() ? `<button class="btn pri" id="itAdd" style="margin-top:8px">${ic('plus')} بند جديد</button>` : ''}
    <div id="itList" class="muted" style="margin-top:6px">بيحمّل…</div>`);
  if (!S.items) { const r = await api('items'); if (r.ok) { S.items = r; store.set('items', r); } }
  if (!$('#itList')) return;
  if (!S.items) { $('#itList').innerHTML = esc(ERR.net); return; }
  const draw = () => { const q = normAr($('#itQ').value);
    const list = S.items.items.filter(x => (x.active || canManage()) && (!q || normAr(x.name + ' ' + x.code + ' ' + x.sec).includes(q)));
    const secs = [...new Set(list.map(x => x.sec))];
    $('#itList').innerHTML = secs.map(sec => `<div class="grp">${esc(sec)}</div><div class="card" style="padding:2px 14px">${list.filter(x => x.sec === sec).map(x => `<button class="mi" style="font-weight:400" ${canManage() ? `data-it="${esc(x.code)}"` : ''}><span class="pill p-info" dir="ltr" style="min-width:56px;justify-content:center">${esc(x.code)}</span><span style="flex:1;${x.active ? '' : 'text-decoration:line-through;color:var(--muted)'}">${esc(x.name)}</span><small class="muted">${esc(x.unit)}</small></button>`).join('')}</div>`).join('') || emptyBox('search','مفيش بند بالاسم ده'); 
    document.querySelectorAll('[data-it]').forEach(b => b.onclick = () => itemForm(S.items.items.find(x => x.code === b.dataset.it))); };
  $('#itQ').oninput = draw; draw();
  if ($('#itAdd')) $('#itAdd').onclick = () => itemForm(null);
  api('items').then(r => { if (r.ok) { S.items = r; store.set('items', r); if ($('#itList')) draw(); } });
}
function itemForm(it){
  const o = S.items, opt = (v, cur) => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`;
  openSheet(`<h3>${it ? 'تعديل ' + esc(it.code) : 'بند جديد'}</h3>
    ${it ? '' : '<p class="muted" style="font-size:12.5px;margin:-6px 0 6px">الكود بيطلع لوحده من القسم</p>'}
    <label class="f">القسم</label><select class="in" id="iSec">${o.sections.map(([p, n]) => opt(n, it ? it.sec : '')).join('')}</select>
    <label class="f">اسم البند</label><input class="in" id="iName" value="${esc(it ? it.name : '')}">
    <label class="f">الوحدة</label><select class="in" id="iUnit">${o.units.map(u => opt(u, it ? it.unit : 'م2')).join('')}</select>
    <label class="f">ملاحظات</label><input class="in" id="iNotes" value="${esc(it ? it.notes : '')}">
    ${it ? `<label class="row" style="margin-top:12px;gap:8px"><input type="checkbox" id="iAct" ${it.active ? 'checked' : ''}> البند شغال (لو شلته مش هيظهر في الاختيارات)</label>` : ''}
    <div class="err" id="iErr"></div>
    <button class="btn gold" id="iSave">${it ? 'حفظ' : 'ضيف البند'}</button>`);
  $('#iSave').onclick = async () => {
    busy($('#iSave'), true);
    const r = await api('saveItem', {item: {code: it ? it.code : '', sec: $('#iSec').value, name: $('#iName').value, unit: $('#iUnit').value, notes: $('#iNotes').value, active: it ? $('#iAct').checked : true}});
    busy($('#iSave'), false);
    if (!r.ok) { $('#iErr').textContent = errMsg(r); return; }
    S.items = null; toast(it ? 'اتحفظ ✓' : `اتضاف ${r.item.code} ✓`); itemsSheet();
  };
}

function openTakeoff(){ logAct('فتح الحصر', S.project || ''); window.open(execUrl(), '_blank'); }

/* ================= الربط ================= */
function wireShell(){
  const v = $('#view');
  bindAutosave(v);
  document.querySelectorAll('nav.bn [data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.project = null; render(); scrollTo(0,0); });
  $('#fab').onclick = fabSheet;
  $('#searchBtn').onclick = () => { S.tab = 'projects'; S.project = null; render(); setTimeout(() => { const s = $('#pSearch'); if (s) s.focus(); }, 50); };
  $('#bellBtn').onclick = notesSheet;
  const eye = $('#eyeBtn');
  if (eye) eye.onclick = () => { S.masked = !S.masked; store.set('masked', S.masked); render(); };
  const openP = b => b.onclick = () => { S.project = b.dataset.open; logAct('فتح مشروع', S.project); render(); scrollTo(0,0); };
  v.querySelectorAll('[data-open]').forEach(openP);
  v.querySelectorAll('[data-t2]').forEach(b => b.onclick = () => { S.tab = b.dataset.t2; render(); });
  v.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => soon(b.dataset.soon));
  v.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { if (b.dataset.sec === 'takeoff') openTakeoff(); else soon(b.dataset.n); });
  v.querySelectorAll('[data-flt]').forEach(b => b.onclick = () => { S.pFilter = b.dataset.flt; S.tab = 'projects'; render(); });
  v.querySelectorAll('[data-team]').forEach(b => b.onclick = teamSheet);
  const back = $('#back'); if (back) back.onclick = () => { S.project = null; S.tab = 'projects'; render(); };
  const ok = $('#newsOk'); if (ok) ok.onclick = () => { store.set('seenVersion', APP_VERSION); render(); };
  const ps = $('#pSearch');
  if (ps) ps.oninput = () => {
    const q = ps.value.trim();
    const list = S.projects.filter(p => (S.pFilter === 'all' || p.status === S.pFilter) && (!q || (p.name + p.code + p.client).includes(q)));
    $('#pList').innerHTML = list.map(p => projectCard(p)).join('') || emptyBox('search','مفيش نتايج');
    $('#pList').querySelectorAll('[data-open]').forEach(openP);
  };
  const id = x => document.getElementById(x);
  if (id('newProj')) id('newProj').onclick = () => projectForm('');
  if (id('editProj')) id('editProj').onclick = () => projectForm(S.project);
  if (id('openLog')) id('openLog').onclick = logSheet;
  if (id('team')) id('team').onclick = teamSheet;
  if (id('settings')) id('settings').onclick = settingsSheet;
  if (id('actLog')) id('actLog').onclick = logSheet;
  if (id('report')) id('report').onclick = reportSheet;
  if (id('install')) id('install').onclick = () => { if (isStandalone()) toast('التطبيق متثبت عندك بالفعل ✓'); else { store.set('skipInstall', false); render(); } };
  if (id('logout')) id('logout').onclick = () => { api('logout'); signOut(); };
  if (id('items')) id('items').onclick = itemsSheet;
  v.querySelectorAll('[data-ppl]').forEach(b => b.onclick = () => peopleSheet(b.dataset.ppl));
  if (id('backups')) id('backups').onclick = backupSheet;
  if (id('reports')) id('reports').onclick = reportsSheet;
  /* تحديث من جوجل في الخلفية */
  loadProjects(); loadNotes();
  if (isBoss() && S.tab === 'home' && !S.project && !S.teamLoaded) { S.teamLoaded = true; loadTeam().then(() => { if (S.tab === 'home' && !S.project && !$('#sheet').classList.contains('on')) render(); }); }
}

/* ================= البداية ================= */
(function boot(){
  const code = new URLSearchParams(location.search).get('invite');
  if (code) {
    S.invite = code; store.set('pendingInvite', code);
    /* لو موبايل عليه حساب تاني، الدعوة الجديدة بتطلعه منه */
    if (S.session) { S.session = ''; S.user = null; ['session','user','pinHash','lockFails','projects','team'].forEach(store.del); S.projects = []; }
    history.replaceState(null, '', location.pathname);
  }
})();
addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });
addEventListener('appinstalled', () => { toast('اتثبت ✓'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
